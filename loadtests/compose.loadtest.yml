# `make loadtest` only (M15, ADR-0022; docs/benchmarks/load.md): web as in production for
# the duration of a load test on the dev stack, then put back (loadtests/run_load.py).
# - two replicas of gunicorn with Uvicorn workers (WEB_CONCURRENCY each), production
#   settings (DEBUG off), plain HTTP on the dev port;
# - Traefik's per-address limits raised: every virtual user comes from one address.
#   The router labels themselves are unchanged.
services:
  web:
    command: ["gunicorn", "--config", "config/gunicorn_conf.py", "config.asgi:application"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECURE_SSL_REDIRECT: "0"
      PUBLIC_SCHEME: http
      PUBLIC_PORT: ${HTTP_PORT:-80}
      WEB_CONCURRENCY: ${LOADTEST_WEB_CONCURRENCY:-3}
      POSTGRES_POOL_MAX_SIZE: ${LOADTEST_POOL_MAX_SIZE:-8}
    deploy:
      replicas: ${LOADTEST_WEB_REPLICAS:-2}
    labels:
      traefik.http.middlewares.xtream-ratelimit.ratelimit.average: "100000"
      traefik.http.middlewares.xtream-ratelimit.ratelimit.burst: "100000"
      traefik.http.middlewares.customer-auth-ratelimit.ratelimit.average: "100000"
      traefik.http.middlewares.customer-auth-ratelimit.ratelimit.burst: "100000"
