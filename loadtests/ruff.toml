# Lint settings for the load test drivers (standard library, plus Locust in its own image).
# They print results, call docker and Locust picks users at random, all on purpose.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S", "PL", "DTZ"]
ignore = ["PLR2004", "S311", "S603", "S607", "PLR0913", "PLR0915", "T201"]
