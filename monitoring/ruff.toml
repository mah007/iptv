# Lint settings for the monitoring tools and tests (make monitoring-test). Standard
# library only, run with the host's python3; the rules mirror streaming/ruff.toml.
target-version = "py310"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S", "PL", "T20", "DTZ"]
ignore = ["PLR2004"]

[lint.per-file-ignores]
# The dashboard generator is a command-line tool and its panel builders take many
# options; test drivers print results and call docker on purpose.
"grafana/build_dashboards.py" = ["T201", "PLR0913", "PLR0915", "E501"]
# Test drivers print results and call docker on purpose; the redaction cases are raw
# log lines kept whole, however long, and /tmp paths are container tmpfs mounts.
"tests/**" = ["S101", "S104", "S108", "S311", "S603", "S607", "T201", "PLR0912", "PLR0913", "PLR0915"]
"tests/redaction_cases.py" = ["E501"]
