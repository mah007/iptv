# The Smart IPTV dashboards (ADR-0018), generated by monitoring/grafana/build_dashboards.py
# and provisioned read-only: change them in the generator, not in the UI.
apiVersion: 1

providers:
  - name: smart-iptv
    folder: Smart IPTV
    folderUid: smart-iptv
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
