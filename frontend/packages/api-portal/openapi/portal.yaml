          format: uuid
      required:
        - title_id
        - title_type
    TitleType:
      enum:
        - movie
        - series
      type: string
      description: |-
        * `movie` - Movie
        * `series` - Series
    TrackLanguages:
      type: object
      properties:
        audio:
          type: array
          items:
            type: string
          description: ISO 639-2 codes.
        subtitles:
          type: array
          items:
            type: string
          description: ISO 639-2 codes.
      required:
        - audio
        - subtitles
    UserStatus:
      enum:
        - active
        - suspended
        - disabled
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `disabled` - Disabled
    ViewerState:
      type: object
      description: The signed-in customer's relation to the title.
      properties:
        favorite:
          type: boolean
        rating:
          $ref: "#/components/schemas/Thumb"
        progress:
          oneOf:
            - $ref: "#/components/schemas/Progress"
            - type: "null"
      required:
        - favorite
        - progress
        - rating
    WatchItem:
      type: object
      description: A movie or an episode you started (or the next episode of a series
        you watch).
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
          description: The history entry; null for an up-next.
        type:
          allOf:
            - $ref: "#/components/schemas/PlayingType"
          readOnly: true
        title:
          allOf:
            - $ref: "#/components/schemas/TitleCard"
          readOnly: true
        episode:
          oneOf:
            - $ref: "#/components/schemas/Episode"
            - type: "null"
          readOnly: true
        position_ms:
          type: integer
        duration_ms:
          type: integer
        completed:
          type: boolean
        updated_at:
          type: string
          format: date-time
      required:
        - completed
        - duration_ms
        - episode
        - id
        - position_ms
        - title
        - type
        - updated_at
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - NOT_AUTHENTICATED
        - PERMISSION_DENIED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - MFA_REQUIRED
        - MFA_SETUP_REQUIRED
        - MFA_INVALID
        - SUBSCRIPTION_EXPIRED
        - CONCURRENCY_LIMIT
        - CATEGORY_NOT_ALLOWED
        - DEVICE_BLOCKED
        - DEVICE_LIMIT
        - TITLE_PREPARING
        - CONFLICT
        - PROVIDER_UNAVAILABLE
        - ACCOUNT_SUSPENDED
        - DEVICE_NOT_APPROVED
        - IP_BLOCKED
        - GEO_BLOCKED
        - CONTENT_TYPE_NOT_ALLOWED
        - QUALITY_NOT_ALLOWED
        - LICENSE_EXPIRED
        - TRIAL_NOT_ELIGIBLE
        - PAYMENT_PROVIDER_UNAVAILABLE
        - PAYMENT_PROVIDER_ERROR
        - WEBHOOK_INVALID
      description: Stable machine-readable error code.
    Problem:
      type: object
      description: RFC 9457 problem details, served as application/problem+json.
      properties:
        type:
          type: string
          description: urn:smart-iptv:problem:<code>
        title:
          type: string
        status:
          type: integer
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
        field_errors:
          type: object
          description: Messages per field; nested fields use dotted paths.
          additionalProperties:
            type: array
            items:
              type: string
        field_error_codes:
          type: object
          description: "A stable code per message of field_errors (same keys, same
            order): DRF's validation codes (required, max_length, invalid, unique,
            ...) or the API's own (username_taken, password_length, ...). Clients
            translate the codes and fall back to the messages."
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - type
        - title
        - status
        - code
        - detail
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
    portalSession:
      type: apiKey
      in: cookie
      name: sessionid
