openapi: 3.1.0
info:
  title: Smart IPTV Customer API
  version: 1.0.0
  description: "Same-origin API of the customer portal (app.<domain>/api/v1): session
    cookie plus CSRF. Apps use the same routes on api.<domain>/api/v1 with bearer
    tokens (auth/login, auth/refresh). Errors are RFC 9457 problem details."
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf
      description: "GET /api/v1/auth/csrf: sets the `csrftoken` cookie the SPA echoes
        as X-CSRFToken."
      summary: Set the CSRF cookie
      tags:
        - auth
      responses:
        "204":
          description: The csrftoken cookie is set.
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/login:
    post:
      operationId: auth_login
      description: Opens a session after `GET auth/csrf`; send the CSRF token as X-CSRFToken.
        The session lasts security.customer_session_days of idle time.
      summary: Sign in to the portal (session cookie)
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMe"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many attempts (ACCOUNT_LOCKED, RATE_LIMITED); see Retry-After.
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      summary: Sign out; this browser's playback stops
      tags:
        - auth
      security:
        - portalSession: []
        - {}
      responses:
        "204":
          description: Signed out.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/password/forgot:
    post:
      operationId: auth_password_forgot
      description: Always 202, whether or not the login names an account with an email.
      summary: Email a password-reset link
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "202":
          description: Accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many attempts (ACCOUNT_LOCKED, RATE_LIMITED); see Retry-After.
        default:
