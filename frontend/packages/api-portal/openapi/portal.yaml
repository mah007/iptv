          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/watch-history/{id}:
    delete:
      operationId: watch_history_delete
      description: A customer endpoint answering in the request's language.
      summary: Forget one title (it also leaves continue-watching)
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - watch-history
      security:
        - bearerToken: []
        - portalSession: []
      responses:
        "204":
          description: No response body
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such resource (NOT_FOUND).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
