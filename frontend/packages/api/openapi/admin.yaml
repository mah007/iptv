      description: Writable profile fields. Phones are stored in E.164 (+966 when
        no prefix is typed).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          title: Email address
          oneOf:
            - type: string
              format: email
              maxLength: 254
            - type: string
              maxLength: 0
        phone:
          type: string
          maxLength: 16
        locale:
          $ref: "#/components/schemas/Locale"
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        notes:
          type: string
        marketing_opt_in:
          type: boolean
    PatchedRoleRequest:
      type: object
      description: A role and its permission codes. The owner role always lists every
        permission.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 200
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
    PatchedSettingRequest:
      type: object
      description: "PATCH body. Partial like any PATCH: without `value` nothing changes."
      properties:
        value:
          type:
            - boolean
            - number
            - string
    Permission:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
        - code
        - description
    Role:
      type: object
      description: A role and its permission codes. The owner role always lists every
        permission.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 200
        permissions:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 16
        is_system:
          type: boolean
          readOnly: true
        admin_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - admin_count
        - created_at
        - id
        - is_system
        - name
        - updated_at
    RoleBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
        - id
        - name
    RoleRequest:
      type: object
      description: A role and its permission codes. The owner role always lists every
        permission.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 200
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 16
      required:
        - name
    SettingEntry:
      type: object
      description: A registered setting with its effective value. Sensitive values
        are never sent.
      properties:
        key:
          type: string
          readOnly: true
        group:
          type: string
          readOnly: true
        kind:
          allOf:
            - $ref: "#/components/schemas/SettingKind"
          readOnly: true
        description:
          type: string
          readOnly: true
        default:
          type:
            - boolean
            - number
            - string
            - "null"
          readOnly: true
        value:
          type:
            - boolean
            - number
            - string
            - "null"
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        sensitive:
          type: boolean
          readOnly: true
        min_value:
          type:
            - number
            - "null"
          format: double
          readOnly: true
        max_value:
          type:
            - number
            - "null"
          format: double
          readOnly: true
        choices:
          type:
            - array
            - "null"
          items:
            type: string
          readOnly: true
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        updated_by:
          type:
            - string
            - "null"
          readOnly: true
      required:
        - choices
        - default
        - description
        - group
        - is_default
        - key
        - kind
        - max_value
        - min_value
        - sensitive
        - updated_at
        - updated_by
        - value
    SettingKind:
      enum:
        - bool
        - int
        - float
        - str
      type: string
      description: |-
        * `bool` - BOOL
        * `int` - INT
        * `float` - FLOAT
        * `str` - STR
    SuspendRequest:
      type: object
      properties:
        reason:
          type: string
          default: ""
          maxLength: 200
    UserStatus:
      enum:
        - active
        - suspended
        - disabled
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `disabled` - Disabled
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - NOT_AUTHENTICATED
        - PERMISSION_DENIED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - MFA_REQUIRED
        - MFA_SETUP_REQUIRED
        - MFA_INVALID
        - SUBSCRIPTION_EXPIRED
        - CONCURRENCY_LIMIT
        - CATEGORY_NOT_ALLOWED
        - DEVICE_BLOCKED
        - DEVICE_LIMIT
        - TITLE_PREPARING
        - CONFLICT
      description: Stable machine-readable error code.
    Problem:
      type: object
      description: RFC 9457 problem details, served as application/problem+json.
      properties:
        type:
          type: string
          description: urn:smart-iptv:problem:<code>
        title:
          type: string
        status:
          type: integer
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
        field_errors:
          type: object
          description: Messages per field; nested fields use dotted paths.
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - type
        - title
        - status
        - code
        - detail
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
