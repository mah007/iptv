  /api/v1/admin/transcode-jobs:
    get:
      operationId: transcode_jobs_list
      summary: List transcode jobs, newest first
      parameters:
        - in: query
          name: backend
          schema:
            type: string
            enum:
              - cpu
              - nvenc
              - qsv
              - vaapi
          description: |-
            * `cpu` - CPU (libx264)
            * `qsv` - Intel QSV
            * `vaapi` - VA-API
            * `nvenc` - NVIDIA NVENC
        - in: query
          name: file
          schema:
            type: string
            format: uuid
          description: Jobs of one media file.
        - in: query
          name: ordering
          schema:
            type: array
            items:
              type: string
              enum:
                - -created_at
                - -finished_at
                - -priority
                - -progress
                - -started_at
                - created_at
                - finished_at
                - priority
                - progress
                - started_at
          description: |-
            Sort key; prefix with - for descending. Default: -created_at.

            * `created_at` - Created at
            * `-created_at` - Created at (descending)
            * `priority` - Priority
            * `-priority` - Priority (descending)
            * `progress` - Progress
            * `-progress` - Progress (descending)
            * `started_at` - Started at
            * `-started_at` - Started at (descending)
            * `finished_at` - Finished at
            * `-finished_at` - Finished at (descending)
          explode: false
          style: form
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: array
            items:
              type: string
              enum:
                - cancelled
                - done
                - failed
                - queued
                - running
          description: |-
            * `queued` - Queued
            * `running` - Running
            * `done` - Done
            * `failed` - Failed
            * `cancelled` - Cancelled
          explode: true
          style: form
      tags:
        - transcode-jobs
      security:
        - sessionAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTranscodeJobList"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
