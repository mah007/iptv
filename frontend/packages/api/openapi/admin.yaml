        - CONCURRENCY_LIMIT
        - CATEGORY_NOT_ALLOWED
        - DEVICE_BLOCKED
        - DEVICE_LIMIT
        - TITLE_PREPARING
        - CONFLICT
        - PROVIDER_UNAVAILABLE
        - ACCOUNT_SUSPENDED
        - DEVICE_NOT_APPROVED
        - IP_BLOCKED
        - GEO_BLOCKED
        - CONTENT_TYPE_NOT_ALLOWED
