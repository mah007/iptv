components:
  schemas:
    AccessProfile:
      type: object
      description: A customer's access profile. Empty `category_ids` means every category.
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/AccessStatus"
          readOnly: true
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        max_streams:
          type: integer
          maximum: 50
          minimum: 1
        max_devices:
          type: integer
          maximum: 50
          minimum: 1
        max_quality:
          allOf:
            - $ref: "#/components/schemas/MaxQuality"
          minimum: 0
          maximum: 32767
        concurrency_policy:
          $ref: "#/components/schemas/ConcurrencyPolicy"
        allow_movies:
          type: boolean
        allow_series:
          type: boolean
        allow_live:
          type: boolean
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBrief"
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - categories
        - status
        - updated_at
    AccessProfileRequest:
      type: object
      description: A customer's access profile. Empty `category_ids` means every category.
      properties:
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        max_streams:
          type: integer
          maximum: 50
          minimum: 1
        max_devices:
          type: integer
          maximum: 50
          minimum: 1
        max_quality:
          allOf:
            - $ref: "#/components/schemas/MaxQuality"
          minimum: 0
          maximum: 32767
        concurrency_policy:
          $ref: "#/components/schemas/ConcurrencyPolicy"
        allow_movies:
          type: boolean
        allow_series:
          type: boolean
        allow_live:
          type: boolean
        category_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
          maxItems: 500
    AccessRule:
      type: object
      description: An IP, network or country rule; `user` null means it applies to
        everyone.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
        type:
          allOf:
            - $ref: "#/components/schemas/AccessRuleType"
          readOnly: true
        value:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - expires_at
        - id
        - reason
        - type
        - user
        - value
    AccessRuleCreateRequest:
      type: object
      properties:
        user:
          type:
            - string
            - "null"
          format: uuid
          description: Customer id; omit for a global rule.
        type:
          $ref: "#/components/schemas/AccessRuleType"
        value:
          type: string
          minLength: 1
          description: IP address, CIDR network or ISO 3166-1 alpha-2 country code.
          maxLength: 64
        reason:
          type: string
          default: ""
          maxLength: 200
        expires_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - type
        - value
    AccessRuleType:
      enum:
        - ip_allow
        - ip_deny
        - cidr_deny
        - country_allow
        - country_deny
      type: string
      description: |-
        * `ip_allow` - Allow IP address
        * `ip_deny` - Deny IP address
        * `cidr_deny` - Deny network (CIDR)
        * `country_allow` - Allow country
        * `country_deny` - Deny country
    AccessStatus:
      enum:
        - active
        - expired
        - suspended
        - disabled
      type: string
      description: |-
        * `active` - ACTIVE
        * `expired` - EXPIRED
        * `suspended` - SUSPENDED
        * `disabled` - DISABLED
    ActiveJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          allOf:
            - $ref: "#/components/schemas/TranscodeProfile"
          readOnly: true
        status:
          allOf:
            - $ref: "#/components/schemas/TranscodeJobStatusEnum"
          readOnly: true
        progress:
          type: number
          format: double
          readOnly: true
        backend:
          allOf:
            - $ref: "#/components/schemas/BackendEnum"
          readOnly: true
        priority:
          type: integer
          readOnly: true
        eta_s:
          type:
            - integer
            - "null"
          readOnly: true
      required:
        - backend
        - eta_s
        - id
        - priority
        - profile
        - progress
        - status
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        action:
          type: string
          description: e.g. customer.create, session.kill.
        actor:
          oneOf:
            - $ref: "#/components/schemas/ActivityActor"
            - type: "null"
          readOnly: true
          description: Null for the system.
        target_type:
          type: string
          description: "`app_label.model`, e.g. accounts.device."
        target_id:
          type: string
        target_label:
          type: string
          readOnly: true
          description: A readable name for the target; empty when it no longer exists.
        customer:
          oneOf:
            - $ref: "#/components/schemas/ActivityCustomer"
            - type: "null"
          readOnly: true
          description: The customer the target belongs to, if any.
        before:
          oneOf:
            - {}
            - type: "null"
          readOnly: true
          description: The redacted snapshot before the change, for admins with audit.view.
        after:
          oneOf:
            - {}
            - type: "null"
          readOnly: true
          description: The redacted snapshot after the change, for admins with audit.view.
      required:
        - action
        - actor
        - after
        - at
        - before
        - customer
        - id
        - target_id
        - target_label
        - target_type
    ActivityActor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The admin's name, or their username.
      required:
        - id
        - name
    ActivityCustomer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
    Admin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        status:
          allOf:
            - $ref: "#/components/schemas/UserStatus"
          readOnly: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBrief"
          readOnly: true
        mfa_enabled:
          type: boolean
          readOnly: true
        last_login:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        last_login_ip:
          type:
            - string
            - "null"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - email
        - id
        - last_login
        - last_login_ip
        - mfa_enabled
        - name
        - roles
        - status
        - username
    AdminCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
            - type: string
              format: email
              maxLength: 254
            - type: string
              maxLength: 0
        role_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
        - username
    AdminCreated:
      type: object
      properties:
        admin:
          allOf:
            - $ref: "#/components/schemas/Admin"
          readOnly: true
        password:
          type: string
          readOnly: true
          description: Shown once.
      required:
        - admin
        - password
    Amount:
      type: object
      properties:
        currency:
          type: string
        amount:
          type: integer
      required:
        - amount
        - currency
    AppHint:
      enum:
        - smarters
        - tivimate
        - ibo
        - xciptv
        - ott_navigator
        - smartone
        - iptvnator
        - uhf
        - other
      type: string
      description: |-
        * `smarters` - IPTV Smarters
        * `tivimate` - TiviMate
        * `ibo` - IBO Player
        * `xciptv` - XCIPTV
        * `ott_navigator` - OTT Navigator
        * `smartone` - SmartOne
        * `iptvnator` - IPTVnator
        * `uhf` - UHF
        * `other` - Other
    AudioTrack:
      type: object
      properties:
        stream_index:
          type: integer
        codec:
          type: string
        channels:
          type: integer
        language:
          type: string
        title:
          type:
            - string
            - "null"
        default:
          type: boolean
        forced:
          type: boolean
      required:
        - channels
        - codec
        - default
        - forced
        - language
        - stream_index
        - title
    AuditActor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
      required:
        - id
        - username
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
        actor:
          oneOf:
            - $ref: "#/components/schemas/AuditActor"
            - type: "null"
          readOnly: true
        actor_ip:
