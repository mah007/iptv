openapi: 3.1.0
info:
  title: Smart IPTV Admin API
  version: 1.0.0
  description: Same-origin API of the admin SPA. Errors are RFC 9457 problem details.
paths:
  /api/v1/admin/access-rules:
    get:
      operationId: access_rules_list
      summary: IP, network and country rules, global and per customer
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: scope
          schema:
            type: string
            enum:
              - customer
              - global
          description: |-
            global: rules for everyone; customer: per-customer rules.

            * `global` - global
            * `customer` - customer
        - in: query
          name: type
          schema:
            type: string
            enum:
              - cidr_deny
              - country_allow
              - country_deny
              - ip_allow
              - ip_deny
          description: |-
            * `ip_allow` - Allow IP address
            * `ip_deny` - Deny IP address
            * `cidr_deny` - Deny network (CIDR)
            * `country_allow` - Allow country
            * `country_deny` - Deny country
        - in: query
          name: user
          schema:
            type: string
            format: uuid
          description: Rules of one customer.
      tags:
        - access-rules
      security:
        - sessionAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAccessRuleList"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: access_rules_create
      summary: Add a rule for one customer, or for everyone
      tags:
        - access-rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRuleCreateRequest"
        required: true
      security:
        - sessionAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRule"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
