  /api/v1/admin/customers:
    get:
      operationId: customers_list
      summary: List customers with their access status and device counts
      parameters:
        - in: query
          name: access_status
          schema:
            type: string
            enum:
              - active
              - disabled
              - expired
              - suspended
          description: |-
            What the customer may do right now: active, expired, suspended, disabled.

            * `active` - ACTIVE
            * `expired` - EXPIRED
            * `suspended` - SUSPENDED
            * `disabled` - DISABLED
        - in: query
          name: expiring_within_days
          schema:
            type: integer
          description: Active customers whose access ends within this many days.
        - in: query
          name: ordering
          schema:
            type: array
            items:
              type: string
              enum:
                - -created_at
                - -expires_at
                - -name
                - -username
                - created_at
                - expires_at
                - name
                - username
          description: |-
            Sort key; prefix with - for descending. Default: -created_at.

            * `created_at` - Created at
            * `-created_at` - Created at (descending)
            * `name` - Name
            * `-name` - Name (descending)
            * `username` - Username
            * `-username` - Username (descending)
            * `expires_at` - Expires at
            * `-expires_at` - Expires at (descending)
          explode: false
          style: form
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - disabled
              - suspended
          description: |-
            Account status.

            * `active` - Active
            * `suspended` - Suspended
            * `disabled` - Disabled
      tags:
        - customers
      security:
        - sessionAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomerSummaryList"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: customers_create
      description: The response holds the device credential's password; it is shown
        once.
      summary: Create a customer, their access profile and optionally a first device
      tags:
        - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateRequest"
        required: true
      security:
        - sessionAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCreated"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
