  /api/v1/admin/transcode-jobs/stream:
    get:
      operationId: transcode_jobs_stream
      description: 'Server-sent events: first `snapshot` `{"jobs": [TranscodeJob]}`
        with the queued and running jobs, then a `job` event `{id, status, progress,
        fps, speed, eta_s, backend, encoder, priority, attempts, worker_host, error}`
        for every update (progress at most once a second per job), and a keep-alive
        comment after 15 s without one.'
