          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf
      description: "GET /api/v1/auth/csrf: sets the `csrftoken` cookie the SPA echoes
        as X-CSRFToken."
      summary: Set the CSRF cookie
      tags:
        - auth
      responses:
        "204":
          description: The csrftoken cookie is set.
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/login:
    post:
      operationId: auth_login
      description: "POST /api/v1/auth/login: step one, the password. Never signs in
        by itself."
      summary: Check the password; the response says which MFA step follows
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many attempts (ACCOUNT_LOCKED, RATE_LIMITED); see Retry-After.
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      description: "POST /api/v1/auth/logout: ends the session (also a half-finished
        sign-in)."
      summary: Sign out
      tags:
        - auth
      security:
        - sessionAuth: []
        - {}
      responses:
        "204":
          description: Signed out.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/me:
    get:
      operationId: auth_me
      description: "GET /api/v1/auth/me: the signed-in admin, their roles and permission
        codes."
      summary: The signed-in admin
      tags:
        - auth
      security:
        - sessionAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: ""
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/mfa/verify:
    post:
      operationId: auth_mfa_verify
      description: "POST /api/v1/auth/mfa/verify: step two, the TOTP code; signs the
        session in."
      summary: Verify the authenticator code and sign in
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not allowed (PERMISSION_DENIED, or a more specific code).
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many attempts (ACCOUNT_LOCKED, RATE_LIMITED); see Retry-After.
        default:
          description: Error (RFC 9457 problem details).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    AccessProfile:
      type: object
      description: A customer's access profile. Empty `category_ids` means every category.
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/AccessStatus"
          readOnly: true
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        max_streams:
          type: integer
          maximum: 50
          minimum: 1
        max_devices:
          type: integer
          maximum: 50
          minimum: 1
        max_quality:
          allOf:
            - $ref: "#/components/schemas/MaxQuality"
          minimum: 0
          maximum: 32767
        concurrency_policy:
          $ref: "#/components/schemas/ConcurrencyPolicy"
        allow_movies:
          type: boolean
        allow_series:
          type: boolean
        allow_live:
          type: boolean
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBrief"
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - categories
        - status
        - updated_at
    AccessProfileRequest:
      type: object
      description: A customer's access profile. Empty `category_ids` means every category.
      properties:
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        max_streams:
          type: integer
          maximum: 50
          minimum: 1
        max_devices:
          type: integer
          maximum: 50
          minimum: 1
        max_quality:
          allOf:
            - $ref: "#/components/schemas/MaxQuality"
          minimum: 0
          maximum: 32767
        concurrency_policy:
          $ref: "#/components/schemas/ConcurrencyPolicy"
        allow_movies:
          type: boolean
        allow_series:
          type: boolean
        allow_live:
          type: boolean
        category_ids:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
          maxItems: 500
    AccessRule:
      type: object
      description: An IP, network or country rule; `user` null means it applies to
        everyone.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
        type:
          allOf:
            - $ref: "#/components/schemas/AccessRuleType"
          readOnly: true
        value:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - expires_at
        - id
        - reason
        - type
        - user
        - value
    AccessRuleCreateRequest:
      type: object
      properties:
        user:
          type:
            - string
            - "null"
          format: uuid
          description: Customer id; omit for a global rule.
        type:
          $ref: "#/components/schemas/AccessRuleType"
        value:
          type: string
          minLength: 1
          description: IP address, CIDR network or ISO 3166-1 alpha-2 country code.
          maxLength: 64
        reason:
          type: string
          default: ""
          maxLength: 200
        expires_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - type
        - value
    AccessRuleType:
      enum:
        - ip_allow
        - ip_deny
        - cidr_deny
        - country_allow
        - country_deny
      type: string
      description: |-
        * `ip_allow` - Allow IP address
        * `ip_deny` - Deny IP address
        * `cidr_deny` - Deny network (CIDR)
        * `country_allow` - Allow country
        * `country_deny` - Deny country
    AccessStatus:
      enum:
        - active
        - expired
        - suspended
        - disabled
      type: string
      description: |-
        * `active` - ACTIVE
        * `expired` - EXPIRED
        * `suspended` - SUSPENDED
        * `disabled` - DISABLED
    Admin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        status:
          allOf:
            - $ref: "#/components/schemas/UserStatus"
          readOnly: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBrief"
          readOnly: true
        mfa_enabled:
          type: boolean
          readOnly: true
        last_login:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        last_login_ip:
          type:
            - string
            - "null"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - email
        - id
        - last_login
        - last_login_ip
        - mfa_enabled
        - name
        - roles
        - status
        - username
    AdminCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
            - type: string
              format: email
              maxLength: 254
            - type: string
              maxLength: 0
        role_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
        - username
    AdminCreated:
      type: object
      properties:
        admin:
          allOf:
            - $ref: "#/components/schemas/Admin"
          readOnly: true
        password:
          type: string
          readOnly: true
          description: Shown once.
      required:
        - admin
        - password
    AppHint:
