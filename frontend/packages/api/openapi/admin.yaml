  /api/v1/admin/categories:
    get:
      operationId: categories_list
      description: "GET /api/v1/admin/categories: for access-profile editors now,
        the catalogue in M6."
      summary: List categories, by kind and order
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - live
              - series
              - vod
          description: |-
            * `vod` - Movies
            * `series` - Series
            * `live` - Live TV
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - name: search
          required: false
          in: query
