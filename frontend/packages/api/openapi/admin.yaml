      security:
        - sessionAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
          description: ""
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request (VALIDATION_ERROR, or a more specific code).
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not signed in (NOT_AUTHENTICATED).
        "403":
          content:
            application/problem+json:
