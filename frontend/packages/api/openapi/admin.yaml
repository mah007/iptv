  /api/v1/admin/audit:
    get:
      operationId: audit_list
      description: "GET /api/v1/admin/audit: newest first, filterable, paginated."
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: actor
          schema:
            type: string
            format: uuid
        - in: query
          name: at_after
          schema:
            type: string
            format: date-time
        - in: query
          name: at_before
          schema:
            type: string
            format: date-time
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: target_id
          schema:
            type: string
        - in: query
          name: target_type
          schema:
            type: string
      tags:
        - audit
      security:
        - sessionAuth: []
      responses:
