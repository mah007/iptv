# Transcoding profiles (SPEC §7.3).
#
# apps/media/profiles.py loads and validates this file at worker start, so a typo
# fails there instead of halfway through an encode. The planner (apps/media/planner.py)
# decides WHAT to produce from these numbers; apps/media/ffmpeg.py turns the plan into
# ffmpeg argument lists, using the encoder presets of the backend that runs the job.
#
# Units: bitrates in kbit/s (`*_k`), durations in seconds (`*_s`).
# Argument templates are lists of strings; `{name}` placeholders are filled by
# apps/media/ffmpeg.py and the loader rejects names it doesn't know.

version: 1

# One keyframe every N seconds in every encoded output: -g = round(N × fps),
# -keyint_min = -g and no scene-cut keyframes. Fixed GOPs make every HLS rung cut its
# segments at the same instants, and keep seeking in the progressive MP4 cheap.
keyframe_interval_s: 2

compat_mp4:
  # Progressive MP4 that every IPTV app and TV can play: H.264 High <= L4.1,
  # <= 1080p, 8-bit SDR, +faststart. Sources are fitted into this box (aspect kept,
  # never upscaled).
  max_width: 1920
  max_height: 1080
  video:
    codec: h264
    profile: high
    level: "4.1"
    maxrate_k: 7800
    bufsize_k: 15600
    # Target for encoders whose capped-quality mode also needs one (VAAPI/QSV QVBR).
    target_k: 5000
  # "Copy rather than re-encode": -c:v copy when the source already satisfies all of
  # these (and is SDR and fits the box above). Main and Baseline are subsets of High.
  copy_video_when:
    codecs: [h264]
    profiles: [constrained baseline, baseline, main, high]
    max_level: 41
    pix_fmts: [yuv420p, yuvj420p]
  audio:
    # Track 1 for each source audio track: AAC-LC stereo (downmixed). Copied when the
    # source track is already AAC with at most two channels.
    stereo:
      codec: aac
      bitrate_k: 160
      channels: 2
      copy_codecs: [aac]
    # Track 2, only for multichannel source tracks: the original AC-3/E-AC-3 (or AAC)
    # is kept as is; anything else (DTS, TrueHD, FLAC, PCM...) becomes AAC 5.1.
    surround:
      codec: aac
      bitrate_k: 384
      channels: 6
      copy_codecs: [ac3, eac3, aac]
  subtitle_codec: mov_text
  movflags: "+faststart"

hls:
  # fMP4/CMAF segments, independent segments, VOD playlists.
  segment_s: 6
  # The variant listed first in master.m3u8, where players start.
  default_rung: 540p
  # Rungs are bounding boxes: the source is fitted inside (display aspect kept, square
  # pixels). A rung is produced only when the source fills its box in at least one
  # dimension, so nothing is ever upscaled.
  rungs:
    - { name: 1080p, width: 1920, height: 1080, bitrate_k: 6000 }
    - { name: 720p, width: 1280, height: 720, bitrate_k: 3000 }
    - { name: 540p, width: 960, height: 540, bitrate_k: 2000 }
    - { name: 360p, width: 640, height: 360, bitrate_k: 730 }
  # When the source is this much larger (in height) than the best rung it fills, an
  # extra rung at the source's own size is added (e.g. 720x480 DVD rips get 480p, not
  # only 360p). Its bitrate is scaled from the next rung up by pixel count.
  native_rung_ratio: 1.25
  maxrate_ratio: 1.07
  bufsize_ratio: 1.5
  video:
    codec: h264
    profile: high
    level: "4.1"
  # One AAC stereo rendition per source audio language...
  audio:
    codec: aac
    bitrate_k: 160
    channels: 2
  # ...plus a copied rendition group when the source track is one of these.
  passthrough_audio_codecs: [eac3]

uhd:
  # Only for plans with max_quality=2160, and only for sources taller than this
  # (a UHD version of a 1080p source would add nothing).
  min_source_height: 1440
  max_width: 3840
  max_height: 2160
  # Serve the source itself as the UHD version when it already fits.
  keep_source_when:
    codecs: [hevc, av1]
    max_bitrate_k: 25000
    containers: [mp4, mkv]
  # Otherwise encode HEVC Main10.
  video:
    codec: hevc
    profile: main10
    bitrate_k: 16800
    maxrate_k: 20160
    bufsize_k: 33600

thumbnails:
  # Fallback poster: one frame at 10% of the duration.
  poster_at_ratio: 0.10
  poster_max_height: 1080
  # Scrubbing previews: one 160x90 tile every 10 s, 10x10 tiles per sheet, plus thumbs.vtt.
  sprite:
    interval_s: 10
    tile_width: 160
    tile_height: 90
    columns: 10
    rows: 10

filters:
  # HDR (PQ/HLG) to SDR BT.709 for the H.264 outputs; needs zscale (libzimg).
  tonemap: "zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=tonemap=hable:desat=0,zscale=t=bt709:m=bt709:r=tv"
  deinterlace: "bwdif=mode=send_frame:parity=auto:deint=interlaced"

# Best first. The planner routes a job to the first backend in this order that a live
# worker supports for the codec it needs, falling back to CPU.
backend_preference: [nvenc, qsv, vaapi, cpu]

# Per-backend encoder presets.
#   input_args    before -i (hardware device set-up). Placeholder: {device}.
#   upload_filter appended to the video filter chain after the pixel-format conversion.
#   encoders.<codec>:
#     encoder       ffmpeg encoder name
#     pix_fmt       pixel format handed to the encoder (8-bit outputs)
#     pix_fmt_10bit pixel format for 10-bit outputs (HEVC Main10)
#     args          static arguments (preset, tuning)
#     quality       the capped-quality value (compat MP4)
#     quality_args  capped-quality rate control. Placeholders: {quality} {maxrate} {bufsize} {target}
#     bitrate_args  average-bitrate rate control (HLS rungs, UHD). Placeholders: {bitrate} {maxrate} {bufsize}
#     gop_args      fixed GOP, no scene-cut keyframes. Placeholder: {gop}
backends:
  nvenc:
    queue: transcode.nvenc
    input_args: []
    upload_filter: null
    encoders:
      h264:
        encoder: h264_nvenc
        pix_fmt: yuv420p
        args: [-preset, p5, -tune, hq, -spatial-aq, "1"]
        quality: 21
        quality_args: [-rc, vbr, -cq, "{quality}", -b:v, "0", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-rc, vbr, -b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -keyint_min, "{gop}", -no-scenecut, "1", -forced-idr, "1"]
      hevc:
        encoder: hevc_nvenc
        pix_fmt: yuv420p
        pix_fmt_10bit: p010le
        args: [-preset, p5, -tune, hq, -spatial-aq, "1"]
        quality: 23
        quality_args: [-rc, vbr, -cq, "{quality}", -b:v, "0", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-rc, vbr, -b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -keyint_min, "{gop}", -no-scenecut, "1", -forced-idr, "1"]
  qsv:
    queue: transcode.qsv
    input_args: [-init_hw_device, "qsv=qsv:hw_any,child_device={device}", -filter_hw_device, qsv]
    upload_filter: "hwupload=extra_hw_frames=64"
    encoders:
      # Look-ahead through the extended BRC: the legacy LA rate-control modes are not
      # available on the oneVPL GPU runtime (Gen12+/Arc).
      h264:
        encoder: h264_qsv
        pix_fmt: nv12
        args: [-preset, slower, -extbrc, "1", -look_ahead_depth, "40"]
        quality: 21
        quality_args: [-global_quality, "{quality}", -b:v, "{target}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -idr_interval, "0", -adaptive_i, "0", -adaptive_b, "0"]
      hevc:
        encoder: hevc_qsv
        pix_fmt: nv12
        pix_fmt_10bit: p010le
        args: [-preset, slower, -extbrc, "1", -look_ahead_depth, "40"]
        quality: 23
        quality_args: [-global_quality, "{quality}", -b:v, "{target}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -idr_interval, "0", -adaptive_i, "0", -adaptive_b, "0"]
  vaapi:
    queue: transcode.vaapi
    input_args: [-vaapi_device, "{device}"]
    upload_filter: hwupload
    encoders:
      h264:
        encoder: h264_vaapi
        pix_fmt: nv12
        args: []
        quality: 21
        quality_args: [-rc_mode, QVBR, -global_quality, "{quality}", -b:v, "{target}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-rc_mode, VBR, -b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -idr_interval, "0"]
      hevc:
        encoder: hevc_vaapi
        pix_fmt: nv12
        pix_fmt_10bit: p010le
        args: []
        quality: 23
        quality_args: [-rc_mode, QVBR, -global_quality, "{quality}", -b:v, "{target}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-rc_mode, VBR, -b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -idr_interval, "0"]
  cpu:
    queue: transcode.cpu
    input_args: []
    upload_filter: null
    encoders:
      h264:
        encoder: libx264
        pix_fmt: yuv420p
        args: [-preset, slow]
        quality: 20
        quality_args: [-crf, "{quality}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -keyint_min, "{gop}", -sc_threshold, "0"]
      hevc:
        encoder: libx265
        pix_fmt: yuv420p
        pix_fmt_10bit: yuv420p10le
        args: [-preset, slow]
        quality: 22
        quality_args: [-crf, "{quality}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        bitrate_args: [-b:v, "{bitrate}", -maxrate, "{maxrate}", -bufsize, "{bufsize}"]
        gop_args: [-g, "{gop}", -keyint_min, "{gop}", -x265-params, "scenecut=0:open-gop=0:log-level=error"]
