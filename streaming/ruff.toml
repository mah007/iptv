# Lint settings for the edge's Python tools and tests. They use the standard library
# only and must run on Python 3.10+, so the target is older than the backend's; the
# rule selection mirrors backend/pyproject.toml where it applies.
target-version = "py310"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S", "PL", "T20", "DTZ"]
ignore = ["PLR2004"]

[lint.per-file-ignores]
# Test drivers print results, call docker, use seeded pseudo-random data and list
# addresses such as 0.0.0.0 as data, all on purpose.
"tests/**" = ["S101", "S104", "S311", "S603", "S607", "T201", "PLR0913", "PLR0915"]
