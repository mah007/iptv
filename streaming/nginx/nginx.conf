# Smart IPTV media edge (ADR-0007, SPEC §12): verifies signed media tokens and serves
# bytes. It never sees credentials and never touches Postgres: njs checks the token,
# Django's /internal/stream-auth (Redis only) is asked at most once a minute per token.
#
# Container layout (streaming/README.md):
#   /etc/nginx/nginx.conf                 this file
#   /etc/nginx/edge/                      streaming/nginx (server files, snippets, njs)
#   /docker-entrypoint.d/40-edge-config.sh renders /etc/nginx/conf.d/edge/ from EDGE_*
#
# The server is edge.conf (local disk) or edge-s3.conf (S3/HTTP origin), picked by
# EDGE_MODE through the rendered mode.conf.

load_module modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

# Start-up, configuration and worker messages only. Request-scoped errors go to the
# server's own error_log (EDGE_REQUEST_ERROR_LOG_LEVEL, default emerg) because nginx
# ends every one of them with the raw request line, and that line holds the token.
error_log /dev/stderr warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Byte serving. Files under 8 MB (HLS segments, playlists) go out with sendfile from
    # the page cache; larger ones (progressive MP4) are read with O_DIRECT in the
    # thread pool, so a few films cannot evict the segments every viewer shares.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio threads;
    directio 8m;
    output_buffers 2 1m;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors off;

    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    client_body_timeout 15s;
    client_max_body_size 1k;
    send_timeout 60s;
    reset_timedout_connection on;
    # Players ask for one range at a time; several ranges get the whole file (200).
    max_ranges 1;
    log_not_found off;
    log_subrequest off;

    # Rendered: resolver, preloaded keys, stream-auth upstream, edge id, media root.
    include /etc/nginx/conf.d/edge/http.conf;

    js_engine njs;
    js_path /etc/nginx/edge/njs;
    js_import token from token.js;
    js_set $edge_verdict token.verify;
    js_set $edge_object token.object;
    js_set $edge_auth_key token.authKey;
    js_set $edge_log_path token.logPath;
    js_set $edge_log_session token.logSession;
    js_set $edge_log_kid token.logKid;
    js_set $edge_log_title token.logTitle;
    js_set $edge_log_rendition token.logRendition;

    # Correlation id: Traefik's (or the client's) X-Request-ID when well formed,
    # otherwise nginx's own. It is logged here and passed to stream-auth.
    map $http_x_request_id $edge_request_id {
        "~^[A-Za-z0-9._-]{8,128}$" $http_x_request_id;
        default $request_id;
    }

    # Cache-Control and Accept-Ranges on token URLs come from token.mediaHeaders (a
    # header filter that sees the final status); every other response is no-store.

    # X-Reason on errors: a coarse token verdict, else the reason stream-auth gave
    # (accepted only as [a-z_]{1,32}), else "unavailable" for a 5xx (stream-auth or
    # the origin unreachable). Detailed verdicts stay in the access log.
    map $edge_verdict $edge_token_reason {
        "" "";
        ok "";
        expired expired;
        ip_mismatch ip_mismatch;
        no_keys unavailable;
        default invalid;
    }
    map "$status:$edge_token_reason:$edge_auth_reason" $edge_reason {
        "~^[45][0-9][0-9]:(?<edge_reason_token>[a-z_]+):" $edge_reason_token;
        "~^[45][0-9][0-9]::(?<edge_reason_auth>[a-z_]{1,32})$" $edge_reason_auth;
        "~^5[0-9][0-9]::" unavailable;
        default "";
    }

    # CORS for the portal's player. $edge_cors_origin (rendered cors.conf) echoes an
    # allowed Origin and is empty otherwise, which drops every header below.
    map $edge_cors_origin $edge_cors_expose {
        "" "";
        default "Accept-Ranges, Content-Length, Content-Range, X-Reason, X-Request-ID";
    }
    map "$request_method:$edge_cors_origin" $edge_cors_allow_methods {
        "~^OPTIONS:." "GET, HEAD, OPTIONS";
        default "";
    }
    map "$request_method:$edge_cors_origin" $edge_cors_allow_headers {
        "~^OPTIONS:." "Range";
        default "";
    }
    map "$request_method:$edge_cors_origin" $edge_cors_max_age {
        "~^OPTIONS:." "600";
        default "";
    }

    # One JSON line per request. The token is replaced by its session prefix (path,
    # session); query strings, Referer and raw X-Forwarded-For are never logged.
    log_format edge_json escape=json
        '{"time":"$time_iso8601",'
        '"edge":"$edge_id",'
        '"request_id":"$edge_request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$edge_log_path",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"range":"$http_range",'
        '"session":"$edge_log_session",'
        '"kid":"$edge_log_kid",'
        '"title":"$edge_log_title",'
        '"rendition":"$edge_log_rendition",'
        '"verdict":"$edge_verdict",'
        '"reason":"$edge_reason",'
        '"auth_status":"$edge_auth_status",'
        '"auth_cache":"$edge_auth_cache",'
        '"upstream_cache_status":"$upstream_cache_status",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout edge_json;

    # stream-auth answers, keyed by a hash of the token (the cache never stores a token).
    proxy_cache_path /var/cache/nginx/edge_auth levels=1:2 keys_zone=edge_auth:10m
                     max_size=64m inactive=2m use_temp_path=off;

    include /etc/nginx/conf.d/edge/cors.conf;   # rendered: map $http_origin $edge_cors_origin
    include /etc/nginx/conf.d/edge/mode.conf;   # rendered: edge.conf or origin.conf + edge-s3.conf
}
