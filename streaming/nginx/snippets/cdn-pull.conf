# The checks of a CDN pull (the rendered cdn.conf, ADR-0022, docs/runbooks/cdn-bunny.md).
# The pull zone has checked its viewer's token (Bunny's token authentication, signed by
# the control plane); the edge checks that the request comes from the zone, by the
# origin secret its edge rule adds as X-Origin-Auth, compared in constant time
# (token.cdnVerdict). Pulls skip stream-auth and G-17's per-viewer rate: the zone caches
# what it pulls and serves its viewers itself.
if ($request_method !~ ^(?:GET|HEAD)$) {
    return 405;
}
# "scope" only once the secret matched: a stranger learns nothing about the paths.
if ($edge_cdn_verdict = scope) {
    return 404;
}
if ($edge_cdn_verdict != ok) {
    return 403;
}

types {
    application/vnd.apple.mpegurl m3u8;
    video/mp4 mp4 m4v m4s;
    audio/mp4 m4a;
    video/mp2t ts;
    audio/aac aac;
    text/vtt vtt;
    image/jpeg jpg jpeg;
    image/png png;
    image/webp webp;
    image/avif avif;
    video/webm webm;
    video/x-matroska mkv;
}
default_type application/octet-stream;

include /etc/nginx/edge/snippets/headers.conf;
