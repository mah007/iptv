# The checks every media request passes, shared by the token locations of edge.conf
# and edge-s3.conf. Rewrite phase: method, preflight and the njs token verdict.
# Access phase: stream-auth (heartbeat and kick check), cached per token.
if ($request_method !~ ^(?:GET|HEAD|OPTIONS)$) {
    return 405;
}
# CORS preflight carries no credentials and gets no content: answer it before the
# token checks (the CORS headers come from headers.conf).
if ($request_method = OPTIONS) {
    return 204;
}
if ($edge_verdict = no_keys) {
    return 503;
}
if ($edge_verdict != ok) {
    return 403;
}

auth_request /_auth;
auth_request_set $edge_auth_status $upstream_status;
auth_request_set $edge_auth_cache $upstream_cache_status;
auth_request_set $edge_auth_reason $upstream_http_x_reason;

# stream-auth failures (auth_request answers 500) and an unusable key file: 503.
error_page 500 502 503 504 = @edge_unavailable;

types {
    application/vnd.apple.mpegurl m3u8;
    video/mp4 mp4 m4v m4s;
    audio/mp4 m4a;
    video/mp2t ts;
    audio/aac aac;
    text/vtt vtt;
    image/jpeg jpg jpeg;
    image/png png;
    image/webp webp;
    image/avif avif;
    video/webm webm;
    video/x-matroska mkv;
}
default_type application/octet-stream;

include /etc/nginx/edge/snippets/headers.conf;
