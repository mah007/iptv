# The S3 origin request of edge-s3.conf's token locations (ADR-0007, ADR-0022).
# $edge_object is the bucket object for the verified token (s3.js), never the token, so
# every session shares one cached copy.
proxy_cache edge_media;
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
# Renditions are immutable, so a stale copy is still the right bytes.
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
# Cache by this policy only, whatever the origin says.
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires
                     X-Accel-Redirect X-Accel-Limit-Rate X-Accel-Buffering
                     X-Accel-Charset;

# The origin gets only what it needs: never the client's headers (cookies,
# authorization, forwarding headers), its query string or the token.
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host $edge_origin_authority;
proxy_set_header Connection "";
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

proxy_ssl_server_name on;
proxy_ssl_name $edge_origin_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# An origin error body names the bucket and the object key (S3, R2, B2 and SeaweedFS
# all do), so no origin error reaches the client: nginx answers with its own page
# instead. media.conf maps 5xx to @edge_unavailable.
proxy_intercept_errors on;
error_page 400 404 410 = @edge_not_found;
error_page 403 = @edge_forbidden;
error_page 416 = @edge_range_not_satisfiable;

# Only Content-Length/-Range, ETag and Last-Modified pass from the origin; the edge
# types the response by extension (not by bucket metadata) and sets Cache-Control and
# Accept-Ranges as in local mode.
js_header_filter token.originHeaders;

# Each request (each slice) is signed with the edges' read-only key: a presigned query
# with a fresh date ($edge_s3_query, s3.js; empty for an origin that authorises the
# edge by network). The query never reaches a log.
proxy_pass $edge_origin_scheme://edge_origin$edge_origin_path$edge_s3_query;
