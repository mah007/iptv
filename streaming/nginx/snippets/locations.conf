# Locations shared by edge.conf and edge-s3.conf, apart from the token location.

# Liveness and readiness: 200 while the preloaded key file is usable, else 503.
location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/edge/snippets/headers.conf;
    add_header Cache-Control "no-store" always;
    js_content token.health;
}

# Anything under /v/ that the strict token location does not match (bad characters,
# directories, too many segments).
location /v/ {
    include /etc/nginx/edge/snippets/headers.conf;
    add_header Cache-Control "no-store" always;
    return 403;
}

# The media host serves nothing else. Paths are not logged as sent (token.logPath).
location / {
    include /etc/nginx/edge/snippets/headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}

# Fail closed (media.conf's error_page): stream-auth unreachable or answering anything
# but 2xx/401/403, an unusable key file, or (S3 mode) an origin failure. The client
# gets a retryable 503 and never the media. Error locations set Cache-Control with
# token.mediaHeaders, which replaces any value an earlier pass left (add_header
# would append a second one).
location @edge_unavailable {
    include /etc/nginx/edge/snippets/headers.conf;
    add_header Retry-After "5" always;
    js_header_filter token.mediaHeaders;
    return 503;
}
