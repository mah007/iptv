# Response headers for every location of the media server. Included per location:
# nginx drops all inherited add_header lines in a block that declares its own.
# Headers with an empty value (the maps in nginx.conf) are not sent. Cache-Control is
# not here: token locations get it from token.mediaHeaders, the others add no-store.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header X-Request-ID $edge_request_id always;
add_header X-Reason $edge_reason always;
add_header Vary "Origin" always;
add_header Access-Control-Allow-Origin $edge_cors_origin always;
add_header Access-Control-Expose-Headers $edge_cors_expose always;
add_header Access-Control-Allow-Methods $edge_cors_allow_methods always;
add_header Access-Control-Allow-Headers $edge_cors_allow_headers always;
add_header Access-Control-Max-Age $edge_cors_max_age always;
