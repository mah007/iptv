# Media edge, local disk mode (ADR-0007, SPEC §12). Included through the rendered
# mode.conf when EDGE_MODE=local.
#
# Storage under EDGE_MEDIA_ROOT (mounted read-only):
#   <root>/<title>/<rendition>.<ext>   progressive renditions (compat.mp4, uhd.mp4)
#   <root>/<title>/<rendition>/...     directory renditions (hls/master.m3u8, hls720/...)
# Capped HLS presentations, subtitles and thumbnails are reached through relative
# symlinks inside the asset (ADR-0014), which nginx follows (disable_symlinks off).
server {
    listen 8080 default_server;
    server_name _;

    # Rendered: request-scoped error log level, trusted proxies, the /_auth location.
    include /etc/nginx/conf.d/edge/server.conf;
    include /etc/nginx/edge/snippets/locations.conf;
    # Live TV (ADR-0017): its locations, or nothing when live is not configured.
    include /etc/nginx/conf.d/edge/live.conf;

    # /v/<token>/<tail>. The pattern repeats token.js's grammar as a first filter:
    # tail segments cannot be '.', '..' or hidden, and there are at most eight.
    location ~ "^/v/(?<token>[A-Za-z0-9_.-]{1,256})/(?<tail>[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}){0,7})$" {
        include /etc/nginx/edge/snippets/media.conf;
        js_header_filter token.mediaHeaders;

        # The storage path comes from the verified token (title) plus a tail that
        # token.js has checked against the token's rendition. No other location maps
        # to storage, so no request reaches a file without passing media.conf.
        alias $edge_media_root/$edge_object;
    }
}
