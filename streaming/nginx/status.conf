# Connection and request counters for the Prometheus nginx exporter (ADR-0018).
# Included in the http block of nginx.conf. Its own port, which Traefik never routes
# to and no compose file publishes; private addresses only. It serves no media, sees
# no tokens and writes no access log.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}
