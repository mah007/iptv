# Media edge, S3/HTTP origin mode (ADR-0007, SPEC §12). Included through the rendered
# mode.conf, after origin.conf, when EDGE_MODE=s3.
#
# Same checks as edge.conf; the bytes come from EDGE_ORIGIN_URL in 4 MB slices that
# are cached on local disk for 30 days. The cache key is the object path plus the
# slice range, never the token, so every session shares one cached copy. The origin
# must authorise the edge by network (a private endpoint or a bucket policy limited
# to the edge's addresses): this edge does not sign origin requests.
server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/conf.d/edge/server.conf;
    include /etc/nginx/edge/snippets/locations.conf;

    location ~ "^/v/(?<token>[A-Za-z0-9_.-]{1,256})/(?<tail>[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}){0,7})$" {
        include /etc/nginx/edge/snippets/media.conf;

        slice 4m;
        proxy_cache edge_media;
        proxy_cache_key $edge_object$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # Renditions are immutable, so a stale copy is still the right bytes.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Cache by this policy only, whatever the origin says.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires
                             X-Accel-Redirect X-Accel-Limit-Rate X-Accel-Buffering
                             X-Accel-Charset;

        # The origin gets only what it needs: never the client's headers (cookies,
        # authorization, forwarding headers), its query string or the token.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $edge_origin_authority;
        proxy_set_header Range $slice_range;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_ssl_server_name on;
        proxy_ssl_name $edge_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # An origin error body names the bucket and the object key (S3, MinIO and
        # SeaweedFS all do), so no origin error reaches the client: nginx answers with
        # its own page instead. media.conf maps 5xx to @edge_unavailable.
        proxy_intercept_errors on;
        error_page 400 404 410 = @edge_not_found;
        error_page 403 = @edge_forbidden;
        error_page 416 = @edge_range_not_satisfiable;

        # Only Content-Length/-Range, ETag and Last-Modified pass from the origin; the
        # edge types the response by extension (not by bucket metadata) and sets
        # Cache-Control and Accept-Ranges as in local mode.
        js_header_filter token.originHeaders;

        proxy_pass $edge_origin_scheme://edge_origin$edge_origin_path;
    }

    # Error answers for the token location. Cache-Control comes from token.mediaHeaders
    # (no-store), which replaces any value an earlier header pass left.
    location @edge_not_found {
        include /etc/nginx/edge/snippets/headers.conf;
        js_header_filter token.mediaHeaders;
        return 404;
    }

    # The edge's own denials (token, stream-auth) stay 403. A private bucket answers
    # 403 for a missing key as well; that one, recognisable by an upstream status, is
    # a 404 for the client.
    location @edge_forbidden {
        include /etc/nginx/edge/snippets/headers.conf;
        js_header_filter token.mediaHeaders;
        if ($upstream_status) {
            return 404;
        }
        return 403;
    }

    # The origin's 416 (a range past the last slice) or the range filter's (a range
    # past the end inside the last slice, after a first pass of the header filters).
    location @edge_range_not_satisfiable {
        include /etc/nginx/edge/snippets/headers.conf;
        js_header_filter token.mediaHeaders;
        return 416;
    }
}
