# Media edge, S3/HTTP origin mode (ADR-0007, ADR-0022, SPEC §12). Included through the
# rendered mode.conf, after origin.conf, when EDGE_MODE=s3.
#
# Same checks as edge.conf; the bytes come from EDGE_ORIGIN_URL in 4 MB slices that
# are cached on local disk for 30 days. The cache key is the bucket object plus the
# slice range, never the token, so every session shares one cached copy. Reads are
# signed with the edges' read-only key (a private bucket, G-44); an origin without a
# key must authorise the edge by network.
server {
    # Rendered: plain HTTP behind Traefik, or TLS on a standalone edge (ADR-0022).
    include /etc/nginx/conf.d/edge/listen.conf;

    include /etc/nginx/conf.d/edge/server.conf;
    include /etc/nginx/edge/snippets/locations.conf;
    # Live TV (ADR-0017): served from the local live volume when configured.
    include /etc/nginx/conf.d/edge/live.conf;
    # CDN pulls (ADR-0022): rendered when a CDN may pull from this edge.
    include /etc/nginx/conf.d/edge/cdn.conf;

    # Playlists and subtitles change in place when a title gains a subtitle or a
    # presentation (the publisher overwrites them), so the edge keeps them a minute and
    # then revalidates them with the origin (a conditional GET). They are small: no slices.
    location ~ "^/v/(?<token>[A-Za-z0-9_.-]{1,256})/(?<tail>(?:[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}/){0,7}[A-Za-z0-9_-][A-Za-z0-9_.-]{0,122}\.(?:m3u8|vtt|srt))$" {
        include /etc/nginx/edge/snippets/media.conf;
        proxy_cache_key $edge_object;
        proxy_cache_valid 200 60s;
        proxy_cache_revalidate on;
        include /etc/nginx/edge/snippets/origin.conf;
    }

    # Everything else is immutable (a re-encode publishes under a new prefix): 4 MB
    # slices cached for 30 days.
    location ~ "^/v/(?<token>[A-Za-z0-9_.-]{1,256})/(?<tail>[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,127}){0,7})$" {
        include /etc/nginx/edge/snippets/media.conf;

        slice 4m;
        proxy_cache_key $edge_object$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_set_header Range $slice_range;
        include /etc/nginx/edge/snippets/origin.conf;
    }

    # Error answers for the token location. Cache-Control comes from token.mediaHeaders
    # (no-store), which replaces any value an earlier header pass left.
    location @edge_not_found {
        include /etc/nginx/edge/snippets/headers.conf;
        js_header_filter token.mediaHeaders;
        return 404;
    }

    # The edge's own denials (token, stream-auth) stay 403. A private bucket answers
    # 403 for a missing key as well; that one, recognisable by an upstream status, is
    # a 404 for the client.
    location @edge_forbidden {
        include /etc/nginx/edge/snippets/headers.conf;
        js_header_filter token.mediaHeaders;
        if ($upstream_status) {
            return 404;
        }
        return 403;
    }

    # The origin's 416 (a range past the last slice) or the range filter's (a range
    # past the end inside the last slice, after a first pass of the header filters).
    location @edge_range_not_satisfiable {
        include /etc/nginx/edge/snippets/headers.conf;
        js_header_filter token.mediaHeaders;
        return 416;
    }
}
