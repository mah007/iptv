# Public artwork (SPEC §7.2 step 7, ADR-0009): media.<domain>/images/... from the media
# volume, which the worker fills through apps.metadata.images. Names carry the first
# 16 hex digits of the file's SHA-256 (images/{owner}/{kind}/{size}.{hash}.{ext}), so a
# name never changes content: browsers and CDNs may keep it for a year as immutable.
# Artwork is public like TMDB's own CDN; media under /v/ still needs a signed token.
location ^~ /images/ {
    include /etc/nginx/edge/snippets/headers.conf;
    if ($request_method !~ ^(?:GET|HEAD)$) {
        return 405;
    }
    # Dot files are writes in progress (LocalImageStore's .tmp-*): never served.
    if ($uri ~ "/\.") {
        return 404;
    }
    root /data;
    types {
        image/webp webp;
        image/avif avif;
        image/jpeg jpg jpeg;
        image/png png;
    }
    default_type application/octet-stream;
    # Only on 2xx/3xx: a missing image must not be cached for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    etag on;
}
