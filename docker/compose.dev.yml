# Development overlay: hot reload with sources bind-mounted from the host.
# Containers run as the host user (HOST_UID/HOST_GID, exported by the Makefile)
# so files they write, like caches and node_modules, stay editable.

x-app-dev: &app-dev
  image: smart-iptv/app:dev-tools
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: dev
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # Dev runs next to the desktop on a 15 GB machine: cap each container so a runaway
  # process is OOM-killed inside Docker instead of freezing the host (2026-10-04).
  mem_limit: 2g
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
  volumes:
    - ./backend:/app
    # The streaming plane: transcoding profiles (apps/media/profiles.py finds them under
    # /streaming/ffmpeg) and the token test vectors the playback tests cross-check.
    - ./streaming:/streaming:ro
    # Media libraries, read-only (make sample-media fills ./media; ADR-0009).
    - ./media:/media:ro
    # Xtream contract kit: JSON Schemas and golden fixtures for the contract tests.
    - ./compat:/compat:ro
  working_dir: /app

services:
  traefik:
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.routers.dashboard.service: api@internal

  web:
    <<: *app-dev
    # No access log: it prints raw paths (Xtream paths carry credentials).
    # A reload waits at most 5 s for open SSE streams (admin feeds) instead of hanging (T1).
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app", "--no-access-log", "--timeout-graceful-shutdown", "5"]

  worker:
    <<: *app-dev
    command: ["watchfiles", "--filter", "python", "celery -A config worker --queues default,scan,metadata,images,notify --concurrency 2 --loglevel INFO", "/app"]

  watcher:
    <<: *app-dev
    command: ["watchfiles", "--filter", "python", "python manage.py watch_libraries", "/app"]

  transcoder:
    <<: *app-dev
    # FFmpeg at 2160p needs more memory; 6 of 16 cores keep the desktop responsive.
    mem_limit: 3g
    cpus: 6
    # Reloads on media pipeline changes only: a reload kills the running encode, and
    # edits elsewhere in the backend would otherwise restart it all day (T1).
    command: ["watchfiles", "--filter", "python", "--ignore-paths", "/app/apps/media/tests", "python manage.py run_transcoder", "/app/apps/media"]

  nginx-stream:
    volumes:
      # Direct-play renditions are symlinks to library files (ADR-0010).
      - ./media:/media:ro
    environment:
      # Dev: any origin (ADR-0017). The IPTVnator PWA of make e2e-iptvnator fetches live
      # HLS after the Xtream host's redirect, so browsers send `Origin: null`; no cookies
      # are involved. Production keeps its explicit portal and admin origins.
      EDGE_CORS_ORIGINS: "*"

  migrate:
    <<: *app-dev

  media-init:
    <<: *app-dev
    user: "0:0"
    environment:
      DATA_OWNER: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  beat:
    <<: *app-dev
    command: ["watchfiles", "--filter", "python", "celery -A config beat --schedule /tmp/celerybeat-schedule --loglevel INFO", "/app"]

  meilisearch:
    mem_limit: 1g
    environment:
      MEILI_ENV: development

  # --- Live TV (M12, ADR-0017) ---
  # The packager reloads on apps/live changes only (a reload restarts every ffmpeg).
  live:
    <<: *app-dev
    mem_limit: 768m
    command: ["watchfiles", "--filter", "python", "--ignore-paths", "/app/apps/live/tests", "python manage.py run_live", "/app/apps/live"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      LIVE_ROOT: /live
      # Dev keeps at most 1 GB of catch-up (the demo channel records continuously).
      LIVE_ARCHIVE_MAX_GB: ${LIVE_ARCHIVE_MAX_GB:-1}
    volumes:
      - ./backend:/app
      - ./streaming:/streaming:ro
      - live-data:/live

  live-relay:
    image: smart-iptv/app:dev-tools
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    mem_limit: 256m
    working_dir: /app
    command: ["uvicorn", "apps.live.relay:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log", "--timeout-graceful-shutdown", "5", "--reload", "--reload-dir", "/app/apps/live"]
    volumes:
      - ./backend:/app:ro
      - live-data:/live:ro

  # The dev live source (ADR-0017): MediaMTX stands in for an operator's encoder. Its
  # path `test-pattern` loops the synthetic media/live/test-pattern.mp4 (make
  # sample-media) only while someone reads it (runOnDemand). RTSP on the backend
  # network; nothing is published to the host.
  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg@sha256:00ef3d1a243f3769ca36769b47df241a0c269c83a7735005b817505c49adb651
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./docker/mediamtx/dev.yml:/mediamtx.yml:ro
      - ./media/live:/samples:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9997/v3/paths/list"]
      interval: 15s
      timeout: 5s
      retries: 3
  # --- end M12 ---

  # --- Mailpit (B1, ADR-0012): catches every email the dev stack sends ---
  # SMTP on mailpit:1025 inside the backend network (dev.py points EMAIL_HOST here);
  # the web UI and its API at http://mail.<DOMAIN>. Messages live in memory only.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "2000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.http.routers.mail.rule: Host(`mail.${DOMAIN:-localhost}`)
      traefik.http.routers.mail.entrypoints: web
      traefik.http.routers.mail.service: mail
      traefik.http.services.mail.loadbalancer.server.port: "8025"
  # --- end B1 ---

  frontend:
    image: smart-iptv/frontend:dev-tools
    # Two Vite dev servers plus Vitest runs.
    mem_limit: 3g
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      VITE_HMR_CLIENT_PORT: ${HTTP_PORT:-80}
      HOME: /tmp
      COREPACK_HOME: /pnpm-store/corepack
    volumes:
      - ./frontend:/app
      - pnpm-store:/pnpm-store
    healthcheck:
      test: ["CMD-SHELL", "node -e \"Promise.all([5173,5174].map(p=>fetch('http://127.0.0.1:'+p))).then(r=>process.exit(r.every(x=>x.ok)?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5
    labels:
      traefik.http.services.admin.loadbalancer.server.port: "5173"
      traefik.http.services.portal.loadbalancer.server.port: "5174"

volumes:
  pnpm-store:
