# Included per location: nginx drops inherited add_header lines in any block
# that declares its own. The pages' CSP, Permissions-Policy and Referrer-Policy are per
# app (/tmp/nginx/conf.d/csp-<app>.conf, from @smart-iptv/ui/csp; ADR-0021).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
