# MediaMTX in the dev stack (ADR-0017): the live test source, standing in for an
# operator's own encoder. The live packager pulls rtsp://mediamtx:8554/test-pattern.
# Production ingest uses docker/compose.mediamtx.yml and docker/mediamtx/mediamtx.yml.
logLevel: warn
logDestinations: [stdout]

# Readers on the dev backend network need no credentials; publishing is local only
# (the runOnDemand ffmpeg below). Never use this file outside the dev stack.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
      - action: read
      - action: api
      - action: metrics
  - user: any
    pass:
    ips: ['172.16.0.0/12', '10.0.0.0/8', '192.168.0.0/16']
    permissions:
      - action: read
      - action: api

api: yes
apiAddress: :9997
rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
playback: no
moq: no
metrics: no

paths:
  test-pattern:
    # Synthetic test media (testsrc2 and a sine tone, generated by make sample-media),
    # looped and copied at its real rate while someone reads it.
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -stream_loop -1
      -i /samples/test-pattern.mp4 -c copy -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 10s
    runOnDemandCloseAfter: 10s
