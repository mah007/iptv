# MediaMTX for production ingest (ADR-0017, docs/runbooks/live-tv.md): the operator's own
# encoders, cameras and OBS publish here; the live packager reads the streams over RTSP
# inside the backend network.
#
# Sign-ins (ADR-0023): MediaMTX asks Django about every publish, read and API call
# (POST /internal/mediamtx-auth on the backend network). The users and passwords are admin
# settings (Settings -> Integrations -> Live ingest; the MEDIAMTX_* values of .env until
# they are moved in). docker/compose.mediamtx.yml sets the address, with
# MEDIAMTX_AUTH_TOKEN as MediaMTX's own password, through MTX_AUTHHTTPADDRESS.
logLevel: warn
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://web:8000/internal/mediamtx-auth
# Nothing is exempt: the API, too, needs the read user.
authHTTPExclude: []

api: yes
apiAddress: :9997
rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554
rtmp: yes
rtmpAddress: :1935
srt: yes
srtAddress: :8890
hls: no
webrtc: no
moq: no
playback: no
metrics: no
# Recording stays off (the default): catch-up is recorded by the live packager.

paths:
  # Any path a publisher names (e.g. rtmp://host:1935/studio1) becomes a channel source
  # rtsp://mediamtx:8554/studio1.
  all_others:
