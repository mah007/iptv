# Opt-in read replica (M15, ADR-0022; docs/runbooks/database-replica.md): a hot standby
# of PostgreSQL streaming on the backend network, for reporting reads (dashboard charts,
# billing figures, the storage report, the minute gauges) and a failover copy.
#   make up REPLICA=1, or REPLICA=1 in .env; scripts/install.sh --replica in production.
# Writes, migrations, backups (pgBackRest archives from the primary) and the restore
# drill stay on the primary. The app reads the replica as iptv_app (a standby refuses
# writes anyway) while its lag is within database.replica_max_lag_s (Settings).
services:
  # The primary's side: the replication slot, the pg_hba line, a reload (idempotent).
  replica-prepare:
    image: smart-iptv/postgres-backup:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      target: backup
    # PGDATA's owner (postgres, uid 70): it appends to pg_hba.conf, nothing more.
    user: "70:70"
    entrypoint: ["sh", "/usr/local/bin/replica-prepare"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/docker
      REPLICA_MAX_SLOT_WAL_KEEP: ${REPLICA_MAX_SLOT_WAL_KEEP:-8GB}
    volumes:
      - postgres-run:/var/run/postgresql
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/replica-prepare.sh:/usr/local/bin/replica-prepare:ro
    network_mode: none
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      postgres: { condition: service_healthy }
      db-roles: { condition: service_completed_successfully }

  postgres-replica:
    image: smart-iptv/postgres:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      target: postgres
    restart: unless-stopped
    # As the primary: the entrypoint fixes ownership as root, then runs as postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint"]
    stop_grace_period: 30s
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      PRIMARY_HOST: postgres
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
      # The official entrypoint wants these even for an existing data folder.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint:ro
    networks: [backend]
    mem_limit: ${REPLICA_MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -h 127.0.0.1"]
      interval: 10s
      timeout: 3s
      start_period: 300s
      retries: 10
    depends_on:
      replica-prepare: { condition: service_completed_successfully }

  # Reporting reads (apps.core.replica); web and the worker (the minute gauges, the lag).
  web:
    environment:
      POSTGRES_REPLICA_HOST: postgres-replica
  worker:
    environment:
      POSTGRES_REPLICA_HOST: postgres-replica

volumes:
  postgres-replica-data:
