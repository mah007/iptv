# Production overlay for a single host (SPEC §13, small tier). Use it on top of the base:
#   docker compose --project-directory . -f docker/compose.yml -f docker/compose.prod.yml up -d --build --wait
# Differences from the dev overlay:
# - TLS from Let's Encrypt (HTTP-01), HTTP→HTTPS redirect and HSTS (docker/traefik/prod/)
# - production Django settings and the built runtime images; no source bind mounts
# - no Traefik dashboard
# Runbook: docs/runbooks/deploy.md

x-prod-app: &prod-app
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    # Per web replica; two replicas by default (WEB_REPLICAS, M15): 6 workers in all.
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    # The app services sign in with the restricted database role and Valkey user
    # (docker/app.env, ADR-0020): the owner's and the operator's passwords are not
    # handed to them at all.
    POSTGRES_PASSWORD: ""
    REDIS_STATE_PASSWORD: ""
    REDIS_CACHE_PASSWORD: ""
  # Read-only root file system; scratch space in memory (G-39). Renditions and their
  # work folders live on the media volume, not in /tmp.
  read_only: true
  tmpfs: ["/tmp:size=256m"]

services:
  traefik:
    # The image's entrypoint adds ACME_EMAIL (the Let's Encrypt contact, optional) to the
    # static config (docker/traefik/entrypoint.sh).
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      CROWDSEC_ENTRYPOINT: websecure
      # HSTS preload, the operator's explicit choice, with Django's (G-43).
      HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-0}
    ports:
      - "443:443"
    volumes:
      - ./docker/traefik/prod/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/prod/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt

  web:
    <<: *prod-app
    # Two replicas behind Traefik, rolled one set at a time on updates (M15, ADR-0022).
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    # The anchor's environment repeated: a service's own `environment` replaces the
    # anchor's (YAML merge keys are shallow).
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      POSTGRES_PASSWORD: ""
      REDIS_STATE_PASSWORD: ""
      REDIS_CACHE_PASSWORD: ""
      # A connection pool per gunicorn worker (docs/benchmarks/load.md): 2 replicas x 3
      # workers x 8 = 48 of PostgreSQL's 100 connections at most, whatever the burst.
      POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE:-8}
    volumes:
      # Libraries, read-only; the admin only accepts folders under /media (ADR-0009).
      - ${MEDIA_ROOT:-/srv/media}:/media:ro
    labels:
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls.certresolver: letsencrypt
      # The Xtream host is TV_HOST (e.g. the bare base name), not always tv.<DOMAIN>.
      traefik.http.routers.tv.rule: Host(`${TV_HOST:-tv.${DOMAIN:-localhost}}`) && !PathPrefix(`/internal`) && !PathPrefix(`/metrics`)
      traefik.http.routers.tv.entrypoints: websecure
      traefik.http.routers.tv.tls.certresolver: letsencrypt
      # The admin SPA's same-origin API (admin.<DOMAIN>/api, ADR-0004).
      traefik.http.routers.admin-api.entrypoints: websecure
      traefik.http.routers.admin-api.tls.certresolver: letsencrypt
      # C1 (ADR-0013): the portal's same-origin API and the customer sign-in limit.
      traefik.http.routers.portal-api.entrypoints: websecure
      traefik.http.routers.portal-api.tls.certresolver: letsencrypt
      traefik.http.routers.customer-auth.entrypoints: websecure
      traefik.http.routers.customer-auth.tls.certresolver: letsencrypt
      # M14a (ADR-0021): the admin sign-in limit and CSP reports.
      traefik.http.routers.admin-auth.entrypoints: websecure
      traefik.http.routers.admin-auth.tls.certresolver: letsencrypt
      traefik.http.routers.csp-report.entrypoints: websecure
      traefik.http.routers.csp-report.tls.certresolver: letsencrypt
      # M15 (ADR-0022): standalone edges reach the control plane here, over TLS.
      traefik.http.routers.edges.entrypoints: websecure
      traefik.http.routers.edges.tls.certresolver: letsencrypt

  worker:
    <<: *prod-app
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/media:ro

  watcher:
    <<: *prod-app
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/media:ro

  transcoder:
    <<: *prod-app
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/media:ro

  beat:
    <<: *prod-app

  # Imports (ADR-0025): the only service with the libraries read-write. rclone's per-run
  # config folders live on the in-memory /tmp.
  importer:
    <<: *prod-app
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/media

  # Live TV (ADR-0017): production settings for the packager; the relay needs none.
  live:
    <<: *prod-app

  migrate:
    <<: *prod-app
    # The migrator signs in as the database owner (G-37).
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_ROLE: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_STATE_PASSWORD: ""
      REDIS_CACHE_PASSWORD: ""

  # The media libraries, for the opt-in media backup (Settings → Backups, ADR-0020).
  backup:
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/sources/media:ro

  nginx-stream:
    volumes:
      # Direct-play renditions are symlinks to library files (ADR-0010).
      - ${MEDIA_ROOT:-/srv/media}:/media:ro
    labels:
      traefik.http.routers.media.entrypoints: websecure
      traefik.http.routers.media.tls.certresolver: letsencrypt

  frontend:
    # nginx (unprivileged, uid 101) keeps its pid and temp files in /tmp (G-39).
    read_only: true
    tmpfs: ["/tmp/nginx:uid=101,gid=101,mode=0755"]
    labels:
      traefik.http.routers.admin.entrypoints: websecure
      traefik.http.routers.admin.tls.certresolver: letsencrypt
      traefik.http.routers.portal.entrypoints: websecure
      traefik.http.routers.portal.tls.certresolver: letsencrypt

volumes:
  # Let's Encrypt account and certificates; keep it to avoid re-issuing (rate limits).
  traefik-acme:
