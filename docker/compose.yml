# Base stack (SPEC §13). Use it through the Makefile, which adds the overlays:
#   dev:  docker/compose.dev.yml (hot reload, bind mounts)
# Paths are relative to the repo root (`--project-directory .`).
name: smart-iptv

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every container drops all capabilities and may not gain privileges (G-39, ADR-0020);
# the few that need one add it back where they are defined.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app: &app
  <<: *hardened
  image: smart-iptv/app:${APP_VERSION:-dev}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: runtime
  # docker/app.env: the restricted database role and Valkey user (ADR-0020).
  env_file: [.env, docker/app.env]
  restart: unless-stopped
  logging: *logging
  networks: [backend]
  depends_on:
    postgres: { condition: service_healthy }
    redis-state: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
    meilisearch: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  traefik:
    <<: *hardened
    # traefik:v3.7.13 plus the vendored CrowdSec bouncer plugin and the entrypoint that
    # renders the static configuration and syncs the dynamic folder (ADR-0020).
    image: smart-iptv/traefik:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/traefik.Dockerfile
      args:
        TRAEFIK_IMAGE: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    logging: *logging
    # Binds :80 (and :443 in production) as root without other capabilities; no Docker
    # socket: containers are discovered through docker-proxy (G-36, ADR-0020).
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    environment:
      # The entry point CrowdSec's bouncer guards when CrowdSec is installed.
      CROWDSEC_ENTRYPOINT: web
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [edge, docker-api]
    depends_on:
      docker-proxy: { condition: service_healthy }

  # Traefik's read-only view of the Docker API (G-36, ADR-0020): only the version, the
  # container list, one container's details and the event stream, and only for Traefik.
  # No socket in Traefik itself, and no way to start, stop, exec into or copy files out
  # of a container through it.
  docker-proxy:
    <<: *hardened
    # Root without capabilities: the socket is root's (0660 root:docker on the host).
    user: "0:0"
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    logging: *logging
    read_only: true
    mem_limit: 64m
    command:
      - -loglevel=warn
      - -listenip=0.0.0.0
      - -allowfrom=traefik
      - -allowGET=/(v[0-9.]+/)?(version|_ping|containers/json|containers/[a-zA-Z0-9_.-]+/json|events)
      - -allowHEAD=/(v[0-9.]+/)?_ping
      - -allowhealthcheck
      - -watchdoginterval=600
      - -stoponwatchdog
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    <<: *app
    networks: [edge, backend]
    # Zero-downtime updates (M15, ADR-0022): scripts/rollout.sh starts new replicas next
    # to the old ones, waits for them to be healthy, then stops the old ones gracefully
    # (gunicorn finishes requests in flight within 30 s). Production runs two.
    deploy:
      replicas: ${WEB_REPLICAS:-1}
    stop_grace_period: 35s
    # Signs media URLs and re-verifies them in /internal/stream-auth (ADR-0007); only
    # callers presenting edge_auth_token may use stream-auth (G-16, ADR-0021).
    secrets: [media_token_keys, edge_auth_token]
    volumes:
      # The DB-IP Lite databases the worker downloads (GeoIP, ADR-0021), read-only here.
      - geoip-data:/geoip:ro
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "web"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.services.web.loadbalancer.server.port: "8000"
      # Zero-downtime (M15, ADR-0022): Traefik only routes to healthy replicas (Docker's
      # health), checks each one itself every 5 s, and retries a request whose replica
      # refused the connection (one stopping during a rollout) on another (retry@file).
      traefik.http.services.web.loadbalancer.healthcheck.path: /internal/health/live
      traefik.http.services.web.loadbalancer.healthcheck.hostname: web
      traefik.http.services.web.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.web.loadbalancer.healthcheck.timeout: 3s
      # Internal endpoints are also 404 by URLconf; this is defence in depth.
      traefik.http.routers.api.rule: Host(`api.${DOMAIN:-localhost}`) && !PathPrefix(`/internal`) && !PathPrefix(`/metrics`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.service: web
      traefik.http.routers.api.middlewares: secure-headers@file,retry@file
      traefik.http.routers.tv.rule: Host(`tv.${DOMAIN:-localhost}`) && !PathPrefix(`/internal`) && !PathPrefix(`/metrics`)
      traefik.http.routers.tv.entrypoints: web
      traefik.http.routers.tv.service: web
      traefik.http.routers.tv.middlewares: secure-headers@file,xtream-ratelimit@docker,retry@file
      # Per client IP: IPTV apps fire bursts of catalogue calls, brute force fires more.
      traefik.http.middlewares.xtream-ratelimit.ratelimit.average: "10"
      traefik.http.middlewares.xtream-ratelimit.ratelimit.period: "1s"
      traefik.http.middlewares.xtream-ratelimit.ratelimit.burst: "50"
      # Same-origin APIs (ADR-0004): /api on the admin and portal hosts goes to Django,
      # the rest of those hosts to the SPAs. The explicit priority beats the SPA
      # routers, whose default priority is their rule length.
      traefik.http.routers.admin-api.rule: Host(`admin.${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.admin-api.priority: "1000"
      traefik.http.routers.admin-api.entrypoints: web
      traefik.http.routers.admin-api.service: web
      traefik.http.routers.admin-api.middlewares: secure-headers@file,retry@file
      traefik.http.routers.portal-api.rule: Host(`app.${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.portal-api.priority: "1000"
      traefik.http.routers.portal-api.entrypoints: web
      traefik.http.routers.portal-api.service: web
      traefik.http.routers.portal-api.middlewares: secure-headers@file,retry@file
      # --- C1 (ADR-0013): customer sign-in, token refresh and password links, a stricter
      # rate per client IP on the portal and API hosts (SPEC §11); Django adds lockouts.
      traefik.http.routers.customer-auth.rule: (Host(`app.${DOMAIN:-localhost}`) || Host(`api.${DOMAIN:-localhost}`)) && PathPrefix(`/api/v1/auth`)
      traefik.http.routers.customer-auth.priority: "2000"
      traefik.http.routers.customer-auth.entrypoints: web
      traefik.http.routers.customer-auth.service: web
      traefik.http.routers.customer-auth.middlewares: secure-headers@file,customer-auth-ratelimit@docker,retry@file
      traefik.http.middlewares.customer-auth-ratelimit.ratelimit.average: "5"
      traefik.http.middlewares.customer-auth-ratelimit.ratelimit.period: "1s"
      traefik.http.middlewares.customer-auth-ratelimit.ratelimit.burst: "20"
      # --- end C1 ---
      # --- M14a (ADR-0021): admin sign-in, the same per-IP limit as customers' (Django adds
      # per-account limits and lockouts), and CSP reports, which any page can send.
      traefik.http.routers.admin-auth.rule: Host(`admin.${DOMAIN:-localhost}`) && PathPrefix(`/api/v1/auth`)
      traefik.http.routers.admin-auth.priority: "2000"
      traefik.http.routers.admin-auth.entrypoints: web
      traefik.http.routers.admin-auth.service: web
      traefik.http.routers.admin-auth.middlewares: secure-headers@file,admin-auth-ratelimit@docker,retry@file
      traefik.http.middlewares.admin-auth-ratelimit.ratelimit.average: "5"
      traefik.http.middlewares.admin-auth-ratelimit.ratelimit.period: "1s"
      traefik.http.middlewares.admin-auth-ratelimit.ratelimit.burst: "20"
      traefik.http.routers.csp-report.rule: (Host(`admin.${DOMAIN:-localhost}`) || Host(`app.${DOMAIN:-localhost}`)) && Path(`/api/v1/csp-report`)
      traefik.http.routers.csp-report.priority: "3000"
      traefik.http.routers.csp-report.entrypoints: web
      traefik.http.routers.csp-report.service: web
      traefik.http.routers.csp-report.middlewares: secure-headers@file,csp-report-ratelimit@docker
      traefik.http.middlewares.csp-report-ratelimit.ratelimit.average: "1"
      traefik.http.middlewares.csp-report-ratelimit.ratelimit.period: "1s"
      traefik.http.middlewares.csp-report-ratelimit.ratelimit.burst: "10"
      # --- end M14a ---
      # --- M15 (ADR-0022): standalone edges' control channel and stream-auth. Bearer
      # secrets per edge; the limit only keeps junk away (a busy edge asks stream-auth
      # about once a minute per playing session).
      traefik.http.routers.edges.rule: Host(`edges.${DOMAIN:-localhost}`)
      traefik.http.routers.edges.entrypoints: web
      traefik.http.routers.edges.service: web
      traefik.http.routers.edges.middlewares: secure-headers@file,edges-ratelimit@docker,retry@file
      traefik.http.middlewares.edges-ratelimit.ratelimit.average: "300"
      traefik.http.middlewares.edges-ratelimit.ratelimit.period: "1s"
      traefik.http.middlewares.edges-ratelimit.ratelimit.burst: "600"
      # --- end M15 ---

  worker:
    <<: *app
    # The app plus FFmpeg (ffprobe at ingest; ADR-0009).
    image: smart-iptv/media:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: media
    # `publish`: renditions to the S3 origin (M15, ADR-0022), when Settings → Storage turns it on.
    command: ["celery", "-A", "config", "worker", "--queues", "default,scan,metadata,images,notify,publish", "--concurrency", "2", "--loglevel", "INFO"]
    # The worker's metrics (its pool processes' counters), served on this port inside
    # the backend network (apps.core.worker_metrics, ADR-0018).
    environment: &worker-metrics
      CELERY_METRICS_PORT: "9100"
    volumes:
      # Artwork (images/) and, from slice 3, renditions; the overlays add /media.
      - media-data:/data
      # DB-IP Lite country and ASN databases, downloaded monthly (ADR-0021).
      - geoip-data:/geoip
    # TMDB, its image CDN and DB-IP's downloads need the internet; backend has none.
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis-state: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5 > /dev/null"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    healthcheck:
      # Fresh while beat schedules the heartbeat and a worker runs it.
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "beat"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # Watches the libraries and queues scans of new, changed and removed files (SPEC §7.1).
  watcher:
    <<: *app
    image: smart-iptv/media:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: media
    command: ["python", "manage.py", "watch_libraries"]
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "watcher"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Compat MP4 jobs (SPEC §7.3, ADR-0010): detects its encoders at start and consumes
  # only the matching transcode.<backend> queues. CPU only unless a GPU overlay adds
  # devices (docker/compose.gpu-nvidia.yml, docker/compose.gpu-intel.yml).
  transcoder:
    <<: *app
    image: smart-iptv/media:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: media
    command: ["python", "manage.py", "run_transcoder"]
    environment: *worker-metrics
    volumes:
      # Writes renditions/; the overlays add /media (read-only).
      - media-data:/data
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis-state: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination transcoder@$$HOSTNAME --timeout 5 > /dev/null"]
      interval: 30s
      timeout: 15s
      # Hardware detection test-encodes every candidate encoder first.
      start_period: 120s
      retries: 3

  # Applies database migrations once per start, before any app process (web, worker, beat,
  # watcher, transcoder) touches the schema: on a deploy that adds tables, nothing queries
  # them before they exist.
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    # The migrator is the database owner (G-37, ADR-0020); after migrating, it grants the
    # restricted role what it needs (apps/ops/grants.py).
    environment:
      DB_ROLE: owner
    depends_on:
      postgres: { condition: service_healthy }
      db-roles: { condition: service_completed_successfully }

  # Creates or updates the restricted database roles before `migrate`, over PostgreSQL's
  # local socket (no network, no owner password); idempotent (docker/postgres/db-roles.sh).
  db-roles:
    <<: *hardened
    image: smart-iptv/postgres-backup:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      target: backup
    command: ["db-roles"]
    restart: "no"
    logging: *logging
    read_only: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      POSTGRES_REPORTING_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:-}
      # The read replica's streaming role, when set (M15, ADR-0022).
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
    volumes:
      - postgres-run:/var/run/postgresql
    network_mode: none
    depends_on:
      postgres: { condition: service_healthy }

  # Gives the media volume's folders to the user the app runs as, once per start.
  media-init:
    <<: *hardened
    image: smart-iptv/app:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: runtime
    user: "0:0"
    cap_add: [CHOWN]
    read_only: true
    entrypoint: ["sh", "-c"]
    # The CrowdSec overlay mounts /crowdsec-traefik too: the worker writes Traefik's file there.
    command: ["mkdir -p /data/images /data/renditions && chown \"$$DATA_OWNER\" /data /data/images /data/renditions /live /geoip && if [ -d /crowdsec-traefik ]; then chown \"$$DATA_OWNER\" /crowdsec-traefik; fi"]
    environment:
      DATA_OWNER: "10001:10001"
    volumes:
      - media-data:/data
      - live-data:/live
      - geoip-data:/geoip
    network_mode: none
    restart: "no"
    logging: *logging

  # The media edge (streaming/, ADR-0007): public artwork at media.<DOMAIN>/images/ and
  # signed /v/<token>/ media from /data/renditions (ADR-0010). Direct-play sources are
  # symlinks into /media, which the overlays mount read-only at the same path.
  # Plain HTTP behind Traefik.
  nginx-stream:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: [/var/cache/nginx, /run, /tmp, /etc/nginx/conf.d]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      # The local edge in the admin's Edges page and in session records (ADR-0022).
      EDGE_ID: local
      EDGE_AUTH_UPSTREAM: web:8000
      EDGE_KEYS_FILE: /run/secrets/media_token_keys
      EDGE_MEDIA_ROOT: /data/renditions
      EDGE_RESOLVER: 127.0.0.11
      # Traefik's address on the Docker networks: X-Forwarded-For from it is trusted.
      EDGE_REAL_IP_FROM: ${EDGE_REAL_IP_FROM:-172.16.0.0/12}
      # The portal's and the admin's players fetch HLS, subtitles and thumbnails (T1).
      EDGE_CORS_ORIGINS: ${EDGE_CORS_ORIGINS:-https://app.${DOMAIN:-localhost} https://admin.${DOMAIN:-localhost}}
      # Live TV (ADR-0017): segments from the live volume, streams from the relay.
      EDGE_LIVE_ROOT: /live
      EDGE_LIVE_RELAY: live-relay:8090
    # The shared secret for the internal stream-auth (G-16, ADR-0021).
    secrets: [media_token_keys, edge_auth_token]
    volumes:
      - ./streaming/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./streaming/nginx:/etc/nginx/edge:ro
      - ./streaming/nginx/docker-entrypoint.d/40-edge-config.sh:/docker-entrypoint.d/40-edge-config.sh:ro
      - ./docker/nginx-stream/50-images.sh:/docker-entrypoint.d/50-images.sh:ro
      - ./docker/nginx-stream/images.conf:/etc/nginx/smart-iptv/images.conf:ro
      - media-data:/data:ro
      - live-data:/live:ro
    networks: [edge, backend]
    depends_on:
      media-init: { condition: service_completed_successfully }
      web: { condition: service_healthy }
      live-relay: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      traefik.enable: "true"
      # No compression on media (SPEC §13); the edge sets its own headers.
      traefik.http.routers.media.rule: Host(`media.${DOMAIN:-localhost}`)
      traefik.http.routers.media.entrypoints: web
      traefik.http.routers.media.service: media
      # nosniff and frame-deny; HSTS in production (M14a, ADR-0021).
      traefik.http.routers.media.middlewares: secure-headers@file
      traefik.http.services.media.loadbalancer.server.port: "8080"

  # Live TV (ADR-0017): the packager runs one ffmpeg per watched (or recording)
  # channel, copying its source into HLS on the live volume; it reads channels from
  # Postgres and pulls sources from the internet or the LAN (egress).
  live:
    <<: *app
    image: smart-iptv/media:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: media
    command: ["python", "manage.py", "run_live"]
    environment:
      LIVE_ROOT: /live
    volumes:
      - live-data:/live
    networks: [backend, egress]
    stop_grace_period: 15s
    depends_on:
      postgres: { condition: service_healthy }
      redis-state: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "live"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # The live relay (ADR-0017): what the edge cannot serve from a file (continuous
  # .ts, the live playlist, catch-up windows). No database: it reads the live volume and
  # asks web's /internal/stream-auth while a stream lasts, with the edges' shared secret.
  live-relay:
    image: smart-iptv/app:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: runtime
    command: ["uvicorn", "apps.live.relay:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log", "--timeout-graceful-shutdown", "5"]
    <<: *hardened
    restart: unless-stopped
    logging: *logging
    read_only: true
    environment:
      LIVE_ROOT: /live
      LIVE_RELAY_AUTH_URL: http://web:8000/internal/stream-auth
      LIVE_RELAY_AUTH_HOST: web
    secrets: [edge_auth_token]
    volumes:
      - live-data:/live:ro
    networks: [backend]
    depends_on:
      media-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "relay"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # PostgreSQL 18 with pgBackRest (docker/postgres.Dockerfile, ADR-0020). Finished WAL
  # segments go to the backup repository (point-in-time recovery) once the backup
  # service has set it up; until then they are released (pgbackrest-iptv-archive).
  postgres:
    <<: *hardened
    image: smart-iptv/postgres:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      target: postgres
    restart: unless-stopped
    logging: *logging
    # The entrypoint fixes ownership as root, then runs PostgreSQL as `postgres` (gosu).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/pgbackrest-iptv-archive %p
      - -c
      - archive_timeout=${PG_ARCHIVE_TIMEOUT:-300}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      # The local socket, shared with db-roles and the backup service (trusted there).
      - postgres-run:/var/run/postgresql
      # pgbackrest.conf, the archiving switch and pgBackRest's locks (the backup service).
      - backup-config:/backup-config
      # The backup repository: archive-push writes WAL to backups/pgbackrest.
      - ${BACKUP_DIR:-backup-repo}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # Valkey users per kind of client (G-38, ADR-0020): `default` (operator, tests), `app`
  # (the app services; administrative and destructive commands refused), `exporter`.
  redis-state:
    <<: *hardened
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    logging: *logging
    # The entrypoint fixes ownership of /data as root (DAC_READ_SEARCH: into root's
    # 0700 folders), then runs Valkey as `valkey`.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    environment:
      VALKEYCLI_AUTH: ${REDIS_STATE_PASSWORD}
      VALKEY_DEFAULT_PASSWORD: ${REDIS_STATE_PASSWORD}
      VALKEY_APP_PASSWORD: ${REDIS_STATE_APP_PASSWORD:-}
      VALKEY_EXPORTER_PASSWORD: ${REDIS_STATE_EXPORTER_PASSWORD:-}
    entrypoint: ["sh", "/usr/local/bin/iptv-valkey-entrypoint"]
    # Sessions, slots and the broker must never be evicted or lost (SPEC §4); a memory
    # ceiling with headroom makes a full instance refuse writes instead of the host
    # running out of memory (G-35; the RedisStateMemoryHigh alert warns at 80%).
    command: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_STATE_MAXMEMORY:-1gb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-state-data:/data
      - ./docker/valkey/entrypoint.sh:/usr/local/bin/iptv-valkey-entrypoint:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis-cache:
    <<: *hardened
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    logging: *logging
    # The entrypoint fixes ownership of /data as root (DAC_READ_SEARCH: into root's
    # 0700 folders), then runs Valkey as `valkey`.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp, /data]
    environment:
      VALKEYCLI_AUTH: ${REDIS_CACHE_PASSWORD}
      VALKEY_DEFAULT_PASSWORD: ${REDIS_CACHE_PASSWORD}
      VALKEY_APP_PASSWORD: ${REDIS_CACHE_APP_PASSWORD:-}
      VALKEY_EXPORTER_PASSWORD: ${REDIS_CACHE_EXPORTER_PASSWORD:-}
    entrypoint: ["sh", "/usr/local/bin/iptv-valkey-entrypoint"]
    # Recomputable data only: evict least-recently-used keys, no persistence.
    command: ["--maxmemory", "${REDIS_CACHE_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    volumes:
      - ./docker/valkey/entrypoint.sh:/usr/local/bin/iptv-valkey-entrypoint:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  meilisearch:
    <<: *hardened
    image: getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # The backup service (apps/ops/agent.py, ADR-0020): asks Django what to do (Settings →
  # Backups), backs PostgreSQL up with pgBackRest (point-in-time recovery), snapshots
  # .env, secrets/, the artwork and a pg_dump with restic, copies everything to an
  # S3-compatible bucket when one is configured, and runs the weekly restore drill.
  # Root with only the capabilities it uses: reading the 0600 .env (DAC_READ_SEARCH),
  # running pgBackRest as `postgres` (SETUID, SETGID), owning its folders (CHOWN).
  backup:
    <<: *hardened
    image: smart-iptv/postgres-backup:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      target: backup
    restart: unless-stopped
    logging: *logging
    cap_add: [DAC_READ_SEARCH, SETUID, SETGID, CHOWN]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    environment:
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: /var/run/postgresql
      PGDATA: /var/lib/postgresql/18/docker
      AGENT_URL: http://web:8000/internal/backups/agent
      # For an operator's own restic and pgbackrest commands (docs/runbooks/backups.md).
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD_FILE: /run/secrets/backup_passphrase
      RESTIC_CACHE_DIR: /backup-config/restic-cache
      PGBACKREST_CONFIG: /backup-config/pgbackrest.conf
      PGBACKREST_STANZA: main
    secrets: [backup_passphrase, backup_agent_token]
    volumes:
      - postgres-data:/var/lib/postgresql:ro
      - postgres-run:/var/run/postgresql
      - backup-config:/backup-config
      - ${BACKUP_DIR:-backup-repo}:/backups
      - backup-drill:/drill
      # What the files snapshot holds (the media libraries come from the overlays).
      - ./.env:/sources/config/.env:ro
      - ./secrets:/sources/config/secrets:ro
      - media-data:/sources/media-data:ro
    # backend: Django and PostgreSQL; egress: the S3-compatible bucket, when configured.
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "/usr/local/lib/smart-iptv/agent.py", "health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Restores the database in place, with PostgreSQL stopped (docs/runbooks/backups.md):
  #   docker compose ... stop <app services> postgres
  #   docker compose ... --profile restore run --rm restore --target latest --yes
  #   docker compose ... up -d
  # --target: latest, a time ('2026-10-11 12:00:00+00') or name:<restore point>.
  restore:
    <<: *hardened
    profiles: [restore]
    image: smart-iptv/postgres-backup:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      target: backup
    entrypoint: ["python3", "/usr/local/lib/smart-iptv/agent.py", "restore-db"]
    restart: "no"
    logging: *logging
    cap_add: [DAC_READ_SEARCH, SETUID, SETGID, CHOWN]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: /var/run/postgresql
      PGDATA: /var/lib/postgresql/18/docker
    secrets: [backup_passphrase]
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-run:/var/run/postgresql
      - backup-config:/backup-config
      - ${BACKUP_DIR:-backup-repo}:/backups
    network_mode: none

  frontend:
    <<: *hardened
    image: smart-iptv/frontend:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *logging
    networks: [edge]
    environment:
      # The SPAs' CSP takes its media origins from Django at start (docker/nginx/30-csp.sh);
      # this is the fallback while web can't be reached (ADR-0021).
      CSP_MEDIA_ORIGINS: ${MEDIA_BASE_URL:-https://media.${DOMAIN:-localhost}} https://*.${DOMAIN:-localhost}
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: Host(`admin.${DOMAIN:-localhost}`)
      traefik.http.routers.admin.entrypoints: web
      traefik.http.routers.admin.service: admin
      traefik.http.routers.admin.middlewares: secure-headers@file,retry@file
      traefik.http.services.admin.loadbalancer.server.port: "8080"
      traefik.http.routers.portal.rule: Host(`app.${DOMAIN:-localhost}`)
      traefik.http.routers.portal.entrypoints: web
      traefik.http.routers.portal.service: portal
      traefik.http.routers.portal.middlewares: secure-headers@file,retry@file
      traefik.http.services.portal.loadbalancer.server.port: "8081"

networks:
  # Traefik and everything it routes to.
  edge:
    name: smart-iptv-edge
  # Data stores. No internet access and no route from Traefik.
  backend:
    name: smart-iptv-backend
    internal: true
  # Outbound internet for the worker (TMDB). Nothing listens on it.
  egress:
    name: smart-iptv-egress
  # Traefik and its Docker API proxy only (G-36). No internet, no other members.
  docker-api:
    name: smart-iptv-docker-api
    internal: true

volumes:
  postgres-data:
  redis-state-data:
  meili-data:
  # Artwork and renditions (ADR-0009). Written by the worker, served read-only by the edge.
  media-data:
  # Live channels' rolling HLS and catch-up archive (ADR-0017). Written by the packager.
  live-data:
  # PostgreSQL's local socket, shared with db-roles and the backup service (ADR-0020).
  postgres-run:
  # pgbackrest.conf, the WAL archiving switch and pgBackRest's locks (the backup service).
  backup-config:
  # The backup repository when BACKUP_DIR is not a host folder (development). Production
  # sets BACKUP_DIR (the installer asks; default /var/backups/smart-iptv).
  backup-repo:
  # The restore drill's throwaway database, emptied after every drill.
  backup-drill:
  # DB-IP Lite country and ASN databases (ADR-0021): written by the worker, read by web.
  geoip-data:

secrets:
  # Media token keys (ADR-0007), generated by `make secrets` (scripts/secrets.sh).
  media_token_keys:
    file: ./secrets/media_token_keys.json
  # The backup passphrase (ADR-0020): encrypts every backup; generated once by
  # scripts/secrets.sh and never changed. Keep a copy away from this server.
  backup_passphrase:
    file: ./secrets/backup_passphrase
  # The backup service's token for Django's internal API (copied from .env).
  backup_agent_token:
    file: ./secrets/runtime/backup_agent_token
  # The edges' shared secret for the internal stream-auth (G-16, ADR-0021), copied from
  # .env by scripts/secrets.sh.
  edge_auth_token:
    file: ./secrets/runtime/edge_auth_token
