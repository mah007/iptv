# Base stack (SPEC §13). Use it through the Makefile, which adds the overlays:
#   dev:  docker/compose.dev.yml (hot reload, bind mounts)
# Paths are relative to the repo root (`--project-directory .`).
name: smart-iptv

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: smart-iptv/app:${APP_VERSION:-dev}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: runtime
  env_file: .env
  restart: unless-stopped
  logging: *logging
  networks: [backend]
  depends_on:
    postgres: { condition: service_healthy }
    redis-state: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
    meilisearch: { condition: service_healthy }

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      # Read-only socket for service discovery; a socket proxy replaces it in M14.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [edge]

  web:
    <<: *app
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "web"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.services.web.loadbalancer.server.port: "8000"
      # Internal endpoints are also 404 by URLconf; this is defence in depth.
      traefik.http.routers.api.rule: Host(`api.${DOMAIN:-localhost}`) && !PathPrefix(`/internal`) && !PathPrefix(`/metrics`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.service: web
      traefik.http.routers.api.middlewares: secure-headers@file
      traefik.http.routers.tv.rule: Host(`tv.${DOMAIN:-localhost}`) && !PathPrefix(`/internal`) && !PathPrefix(`/metrics`)
      traefik.http.routers.tv.entrypoints: web
      traefik.http.routers.tv.service: web
      traefik.http.routers.tv.middlewares: secure-headers@file
      # Same-origin APIs (ADR-0004): /api on the admin and portal hosts goes to Django,
      # the rest of those hosts to the SPAs. The explicit priority beats the SPA
      # routers, whose default priority is their rule length.
      traefik.http.routers.admin-api.rule: Host(`admin.${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.admin-api.priority: "1000"
      traefik.http.routers.admin-api.entrypoints: web
      traefik.http.routers.admin-api.service: web
      traefik.http.routers.admin-api.middlewares: secure-headers@file
      traefik.http.routers.portal-api.rule: Host(`app.${DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.portal-api.priority: "1000"
      traefik.http.routers.portal-api.entrypoints: web
      traefik.http.routers.portal-api.service: web
      traefik.http.routers.portal-api.middlewares: secure-headers@file

  worker:
    <<: *app
    # The app plus FFmpeg (ffprobe at ingest; ADR-0009).
    image: smart-iptv/media:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: media
    command: ["celery", "-A", "config", "worker", "--queues", "default,scan,metadata,images,notify", "--concurrency", "2", "--loglevel", "INFO"]
    volumes:
      # Artwork (images/) and, from slice 3, renditions; the overlays add /media.
      - media-data:/data
    # TMDB and its image CDN need the internet; the backend network has none.
    networks: [backend, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis-state: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5 > /dev/null"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    healthcheck:
      # Fresh while beat schedules the heartbeat and a worker runs it.
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "beat"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # Watches the libraries and queues scans of new, changed and removed files (SPEC §7.1).
  watcher:
    <<: *app
    image: smart-iptv/media:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: media
    command: ["python", "manage.py", "watch_libraries"]
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthcheck", "watcher"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Gives the media volume's folders to the user the app runs as, once per start.
  media-init:
    image: smart-iptv/app:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: runtime
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/images /data/renditions && chown \"$$DATA_OWNER\" /data /data/images /data/renditions"]
    environment:
      DATA_OWNER: "10001:10001"
    volumes:
      - media-data:/data
    network_mode: none
    restart: "no"
    logging: *logging

  # The media edge (streaming/, ADR-0007): public artwork at media.<DOMAIN>/images/ now,
  # signed /v/<token>/ media from slice 3. Plain HTTP behind Traefik.
  nginx-stream:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: [/var/cache/nginx, /run, /tmp, /etc/nginx/conf.d]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      EDGE_AUTH_UPSTREAM: web:8000
      EDGE_KEYS_FILE: /run/secrets/media_token_keys
      EDGE_MEDIA_ROOT: /data/renditions
      EDGE_RESOLVER: 127.0.0.11
      # Traefik's address on the Docker networks: X-Forwarded-For from it is trusted.
      EDGE_REAL_IP_FROM: ${EDGE_REAL_IP_FROM:-172.16.0.0/12}
    secrets: [media_token_keys]
    volumes:
      - ./streaming/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./streaming/nginx:/etc/nginx/edge:ro
      - ./streaming/nginx/docker-entrypoint.d/40-edge-config.sh:/docker-entrypoint.d/40-edge-config.sh:ro
      - ./docker/nginx-stream/50-images.sh:/docker-entrypoint.d/50-images.sh:ro
      - ./docker/nginx-stream/images.conf:/etc/nginx/smart-iptv/images.conf:ro
      - media-data:/data:ro
    networks: [edge, backend]
    depends_on:
      media-init: { condition: service_completed_successfully }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      traefik.enable: "true"
      # No compression on media (SPEC §13); the edge sets its own headers.
      traefik.http.routers.media.rule: Host(`media.${DOMAIN:-localhost}`)
      traefik.http.routers.media.entrypoints: web
      traefik.http.routers.media.service: media
      traefik.http.services.media.loadbalancer.server.port: "8080"

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis-state:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      VALKEYCLI_AUTH: ${REDIS_STATE_PASSWORD}
    # Sessions, slots and the broker must never be evicted or lost (SPEC §4).
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEYCLI_AUTH\" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction"]
    volumes:
      - redis-state-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis-cache:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      VALKEYCLI_AUTH: ${REDIS_CACHE_PASSWORD}
    # Recomputable data only: evict least-recently-used keys, no persistence.
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEYCLI_AUTH\" --maxmemory ${REDIS_CACHE_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    restart: unless-stopped
    logging: *logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  frontend:
    image: smart-iptv/frontend:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *logging
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: Host(`admin.${DOMAIN:-localhost}`)
      traefik.http.routers.admin.entrypoints: web
      traefik.http.routers.admin.service: admin
      traefik.http.routers.admin.middlewares: secure-headers@file
      traefik.http.services.admin.loadbalancer.server.port: "8080"
      traefik.http.routers.portal.rule: Host(`app.${DOMAIN:-localhost}`)
      traefik.http.routers.portal.entrypoints: web
      traefik.http.routers.portal.service: portal
      traefik.http.routers.portal.middlewares: secure-headers@file
      traefik.http.services.portal.loadbalancer.server.port: "8081"

networks:
  # Traefik and everything it routes to.
  edge:
    name: smart-iptv-edge
  # Data stores. No internet access and no route from Traefik.
  backend:
    name: smart-iptv-backend
    internal: true
  # Outbound internet for the worker (TMDB). Nothing listens on it.
  egress:
    name: smart-iptv-egress

volumes:
  postgres-data:
  redis-state-data:
  meili-data:
  # Artwork and renditions (ADR-0009). Written by the worker, served read-only by the edge.
  media-data:

secrets:
  # Media token keys (ADR-0007), generated by `make secrets` (scripts/secrets.sh).
  media_token_keys:
    file: ./secrets/media_token_keys.json
