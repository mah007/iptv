# Optional live ingest (ADR-0017, docs/runbooks/live-tv.md): MediaMTX receives the
# operator's own encoders, cameras and OBS (RTMP 1935/tcp, SRT 8890/udp, RTSP 8554/tcp),
# and the live packager reads the streams over RTSP on the backend network. Add it on
# top of the base and production files:
#   docker compose --project-directory . -f docker/compose.yml -f docker/compose.prod.yml \
#     -f docker/compose.mediamtx.yml up -d mediamtx
# MediaMTX asks Django about every sign-in (ADR-0023): the users and passwords are admin
# settings (Settings -> Integrations -> Live ingest), else MEDIAMTX_PUBLISH_* and
# MEDIAMTX_READ_* in .env. MEDIAMTX_AUTH_TOKEN (generated by scripts/secrets.sh) is
# MediaMTX's own password for that. Open the ingest ports in the firewall only to the
# networks your encoders publish from.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1@sha256:5ce2a948eb68df06ce2e13870db8df8e30d516ac4dc40e04bfe8aee3bdf7be40
    restart: unless-stopped
    # No capabilities (its ports are above 1024), no privilege gain, read-only (G-39).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      # Go sends the address's user and password as Basic auth (user "mediamtx").
      MTX_AUTHHTTPADDRESS: http://mediamtx:${MEDIAMTX_AUTH_TOKEN:?run scripts/secrets.sh to add MEDIAMTX_AUTH_TOKEN to .env}@web:8000/internal/mediamtx-auth
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${LIVE_INGEST_BIND:-0.0.0.0}:1935:1935/tcp"
      - "${LIVE_INGEST_BIND:-0.0.0.0}:8890:8890/udp"
      - "${LIVE_INGEST_BIND:-0.0.0.0}:8554:8554/tcp"
    networks: [backend, edge]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
